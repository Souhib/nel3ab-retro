[package]
name = "nel3ab-encoder"
description = "Zero-copy dma-buf to VAAPI video encoding."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
nel3ab-protocol = { path = "../protocol" }

# Receiving a dma-buf means SCM_RIGHTS, which std does not expose. `nix` wraps
# recvmsg safely, so the fd arrives without this crate needing `unsafe` for it —
# the unsafe exception M2 earns is for libva, not for a socket.
nix = { version = "0.30", default-features = false, features = ["socket", "uio", "fs"] }

[build-dependencies]
# Compiling the libavcodec shim. `cc` and `pkg-config` are both small, no proc
# macros, and no libclang — which is the whole reason the ffmpeg binding is a C
# shim rather than bindgen.
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"

[features]
# Compiling the libva FFI needs libva-dev, and its tests need a GPU. Off by
# default so `cargo test` stays honest on a machine that has neither — a test
# that cannot run must not report a pass.
vaapi = []

# Needs the shim, so it must not be built when `vaapi` is off — otherwise a
# machine without ffmpeg headers fails `cargo test` on an example it cannot use.
[[example]]
name = "encode_latency"
required-features = ["vaapi"]

[lints]
workspace = true
