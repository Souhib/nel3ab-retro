name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main: a cancelled run's commits would never be tested, and the
  # replacing run only covers ITS own push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the secret scan sees the whole range

      # Blocking and unconditional: a leaked key is never "informational".
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: extractions/setup-just@v3

      # `just lint` runs with --all-features, which builds the libavcodec shim's
      # build script — and a build script needs real headers, unlike clippy which
      # only analyses. Installing them here is what keeps `--all-features` honest:
      # the alternative, letting the shim silently not compile, would advertise a
      # lint pass over code nobody built.
      - name: GPU headers and the shader compiler the gated features need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavutil-dev libva-dev glslang-tools

      # The SAME recipes a developer runs locally — the pipeline cannot drift
      # from the pre-commit experience.
      - run: just fmt-check
      - run: just lint
      - run: just test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check

  # The prose, checked the same way the code is. `just docs` runs Zensical in
  # strict mode, which fails on a link or an anchor pointing at nothing.
  #
  # This is here because the logbook is 2800 lines and renaming a section is a
  # normal thing to do: without this job, every link to the old name dies quietly
  # and the first person to find out is a reader. Strict mode found two on its
  # first run, both in a page written the same afternoon.
  #
  # No GPU, no Rust, no cache needed — it is seconds, and it guards the document
  # the project rules call part of the work.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      # The PATH line is not decoration: `uv tool install` drops the executable
      # in ~/.local/bin, and whether that is already on the runner's PATH is the
      # runner image's business, not ours. Stating it costs one line and removes
      # a way for this job to fail for a reason that has nothing to do with the
      # documentation.
      - name: Install Zensical
        run: |
          uv tool install zensical
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just docs
