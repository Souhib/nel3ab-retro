<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The room's mark, inline: the worker serves one file and has no static
         file server, so a favicon at its own URL would be a 404 on every load. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2308080a'/%3E%3Crect x='3' y='5' width='10' height='6' rx='1' fill='none' stroke='%237c6ce0'/%3E%3C/svg%3E"
    />
    <title>nel3ab</title>
  </head>
  <body>
    <!-- Ce qu'on voit avant que le script ait tourné, au lieu d'une page
         blanche (audit E8). React le remplace à son premier rendu par l'écran
         d'ouverture, qui dit la même chose. Les couleurs sont celles de la
         régie de nuit, écrites ici parce que la feuille n'est peut-être pas
         encore lue. -->
    <div id="root">
      <p
        style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#eef0f2;font:600 17px/1.4 system-ui,sans-serif"
      >
        On ouvre la salle.
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
