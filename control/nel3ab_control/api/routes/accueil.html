<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nel3ab — les salles</title>
<style>
  :root {
    --fond: #0b0b0f;
    --carte: #16161d;
    --trait: #2a2a36;
    --texte: #f2f2f5;
    --doux: #a0a0b0;
    --vif: #7c5cff;
    --ouverte: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 5vh 6vw;
    background: var(--fond);
    color: var(--texte);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin: 0 0 .2em; letter-spacing: -.02em; }
  .sous { color: var(--doux); font-size: clamp(1rem, 2vw, 1.4rem); margin: 0 0 2em; }
  .salles { display: grid; gap: 1.2rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  /* La carte entière est le lien: viser une petite étiquette « rejoindre » à
     deux mètres d'un écran est le genre de cible qu'on rate. */
  a.salle {
    background: var(--carte);
    border: 1px solid var(--trait);
    border-radius: 14px;
    padding: 1.5rem;
    min-height: 168px;
    display: flex; flex-direction: column; gap: .6rem;
    color: inherit; text-decoration: none;
    transition: border-color .12s ease, background .12s ease;
  }
  a.salle:hover { border-color: var(--vif); background: #1b1b24; }
  .titre { font-size: clamp(1.3rem, 2.5vw, 1.8rem); font-weight: 600; }
  .etat { color: var(--doux); font-size: 1.05rem; }
  .marques { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: auto; }
  .marque {
    border: 1px solid var(--trait);
    border-radius: 999px;
    padding: .15rem .7rem;
    font-size: .95rem;
    color: var(--doux);
  }
  .rejoindre {
    align-self: flex-start;
    color: var(--vif);
    font-weight: 600;
    font-size: 1.05rem;
  }
  .vide {
    grid-column: 1 / -1;
    border: 1px dashed var(--trait);
    border-radius: 14px;
    padding: 2.5rem 1.5rem;
    text-align: center;
  }
  .vide-titre { margin: 0 0 .4rem; font-size: 1.4rem; font-weight: 600; }
  .vide-mot { margin: 0; color: var(--doux); font-size: 1.05rem; }
  a.bouton, button {
    font: inherit; font-size: 1.1rem; font-weight: 600;
    min-height: 48px; padding: .7rem 1.2rem;
    border-radius: 10px; border: 1px solid var(--trait);
    background: #22222c; color: var(--texte);
    text-decoration: none; text-align: center; cursor: pointer;
  }
  a.bouton { background: var(--vif); border-color: var(--vif); }
  button:hover, a.bouton:hover { filter: brightness(1.15); }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--vif); outline-offset: 3px; }
  .ouvrir { margin-top: 2.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .mot { color: var(--doux); font-size: 1.05rem; }
  .mot[data-refus="oui"] { color: #ffb4a2; }
</style>
</head>
<body>
  <h1>nel3ab</h1>
  <p class="sous">Choisis une salle, ou ouvre la tienne.</p>

  <div class="salles" id="salles" aria-live="polite"></div>

  <div class="ouvrir">
    <button id="ouvrir" type="button">ouvrir une salle</button>
    <span class="mot" id="mot"></span>
  </div>

<script>
  const liste = document.getElementById("salles");
  const mot = document.getElementById("mot");
  const bouton = document.getElementById("ouvrir");

  function dessiner(salles) {
    // Seules les salles OUVERTES sont montrées. Trois cases dont deux vides
    // donnaient à croire que la machine tient trois salles en permanence; il
    // n'en tourne aucune tant que personne n'en ouvre une, et c'est le but.
    const ouvertes = salles.filter(salle => salle.ouverte);
    const libres = salles.length - ouvertes.length;

    if (ouvertes.length === 0) {
      // Un écran vide se lit comme une panne. Celui-ci dit ce qui se passe et
      // ce qu'on peut faire, ce qui est la seule chose qui manque ici.
      liste.replaceChildren(vide());
    } else {
      liste.replaceChildren(...ouvertes.map(carte));
    }

    bouton.disabled = libres === 0;
    bouton.textContent = ouvertes.length === 0 ? "ouvrir la première salle" : "ouvrir une salle";
    if (!mot.dataset.refus) {
      mot.textContent = libres === 0
        ? `les ${salles.length} salles sont ouvertes, rejoins-en une`
        : salles.some(salle => salle.switch)
          ? "une salle joue déjà à la Switch: une seule à la fois"
          : libres === salles.length
            ? "aucune salle n'est ouverte, donc rien ne tourne"
            : `${libres} salle${libres > 1 ? "s" : ""} encore disponible${libres > 1 ? "s" : ""}`;
    }
  }

  function vide() {
    const bloc = document.createElement("div");
    bloc.className = "vide";
    const titre = document.createElement("p");
    titre.className = "vide-titre";
    titre.textContent = "Aucune salle ouverte";
    const dit = document.createElement("p");
    dit.className = "vide-mot";
    dit.textContent =
      "Rien ne tourne sur le serveur pour l'instant. Ouvre une salle et choisis ton jeu.";
    bloc.append(titre, dit);
    return bloc;
  }

  function carte(salle) {
    const carte = document.createElement("a");
    carte.className = "salle";
    carte.href = salle.chemin;

    const titre = document.createElement("div");
    titre.className = "titre";
    titre.textContent = `salle ${salle.numero}`;

    const etat = document.createElement("div");
    etat.className = "etat";
    // Le jeu en toutes lettres, et pas seulement une pastille de couleur: une
    // couleur seule ne se lit ni de loin ni pour qui les distingue mal.
    etat.textContent = salle.jeu ?? "sur son menu";

    const marques = document.createElement("div");
    marques.className = "marques";
    if (salle.switch) {
      const marque = document.createElement("span");
      marque.className = "marque";
      marque.textContent = "Switch";
      marques.append(marque);
    }
    const rejoindre = document.createElement("span");
    rejoindre.className = "rejoindre";
    rejoindre.textContent = "rejoindre";

    carte.append(titre, etat, marques, rejoindre);
    return carte;
  }

  async function relire() {
    try {
      const reponse = await fetch("/api/salles", { cache: "no-store" });
      if (reponse.ok) dessiner(await reponse.json());
    } catch {
      // Le salon redémarre en deux secondes: on retentera au prochain tour
      // plutôt que d'effacer la liste sous les yeux de quelqu'un.
    }
  }

  bouton.addEventListener("click", async () => {
    bouton.disabled = true;
    mot.dataset.refus = "";
    mot.textContent = "on ouvre la salle…";
    try {
      const reponse = await fetch("/api/salles", { method: "POST" });
      const dit = await reponse.json();
      if (reponse.ok) { location.href = dit.chemin; return; }
      mot.dataset.refus = "oui";
      mot.textContent = dit.detail ?? "la salle n'a pas voulu s'ouvrir";
    } catch {
      mot.dataset.refus = "oui";
      mot.textContent = "le salon ne répond pas";
    }
    bouton.disabled = false;
    relire();
  });

  relire();
  setInterval(relire, 5000);
</script>
</body>
</html>
