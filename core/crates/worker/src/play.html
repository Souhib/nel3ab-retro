<!doctype html>
<meta charset="utf-8" />
<title>nel3ab — play</title>
<style>
  :root { color-scheme: dark; font-family: ui-monospace, monospace; }
  body { margin: 0; padding: 1.5rem; background: #0d0d0f; color: #ddd; }
  #wrap { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start; }
  canvas { background: #000; border: 1px solid #333; image-rendering: pixelated; width: 800px; max-width: 100%; }
  #stats { min-width: 22rem; white-space: pre-wrap; line-height: 1.6; font-size: 0.85rem; }
  .bad { color: #ff8080; }
  .note { color: #888; }
  kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 0 0.3em; }
</style>

<div id="wrap">
  <canvas id="screen" width="640" height="480"></canvas>
  <div>
    <div id="stats">connecting…</div>
    <p class="note">
      <kbd>←↑↓→</kbd> stick · <kbd>X</kbd> A · <kbd>C</kbd> B · <kbd>S</kbd> X ·
      <kbd>D</kbd> Y · <kbd>A</kbd> Z · <kbd>Q</kbd> L · <kbd>E</kbd> R ·
      <kbd>Enter</kbd> Start<br />
      A gamepad, if one is plugged in, takes over on its first button press.
    </p>
  </div>
</div>

<script type="module">
  const stats = document.getElementById("stats");
  const context = document.getElementById("screen").getContext("2d");
  const canvas = context.canvas;
  const show = (text, cls = "") =>
    (stats.innerHTML = cls ? `<span class="${cls}">${text}</span>` : text);

  if (!("VideoDecoder" in window)) {
    show(
      "VideoDecoder is absent — this page is not in a secure context.\n" +
        "Reach it over https, or tunnel it to localhost.",
      "bad",
    );
    throw new Error("no WebCodecs");
  }

  // `wss` when the page came over TLS, `ws` otherwise. A page served over https
  // cannot open a `ws://` socket at all — the browser blocks it as mixed content
  // — and the same page has to work behind a Tailscale HTTPS front and on a
  // plain localhost tunnel, so the scheme is derived rather than written down.
  const socketUrl = (path) =>
    `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${path}`;

  // ── video ───────────────────────────────────────────────────────────────
  //
  // The server prefixes each access unit with the capture instant on its own
  // monotonic clock. We never interpret that number — only subtract two of them
  // — so the two clocks never have to agree, which is what makes this an honest
  // measurement rather than a clock-skew artefact.
  let decoder = null;
  let shown = 0;
  let painted = 0;
  let repeated = 0;
  const pipeline = [];
  let firstCapture = null;
  let firstArrival = null;
  let lastArrival = null;
  /// When a frame last arrived, on our own clock — used by the watchdog, and
  /// kept separate from `lastArrival` so resetting one never disarms the other.
  let lastHeard = null;
  const gaps = [];

  // Decoded frames waiting for a refresh to show them, oldest first.
  //
  // This was a single slot at first — keep the newest, drop the rest — and that
  // is wrong in a way worth spelling out, because it looks harmless.
  //
  // A 60 fps source and a 60 Hz display that are not phase-locked put two frames
  // in one refresh interval and none in the next. With one slot the first of the
  // pair is DISCARDED and the empty interval REPEATS the previous picture: one
  // wobble in arrival costs a game frame nobody ever sees, plus a visible stall.
  // Measured over Wi-Fi: five or six of sixty frames a second lost that way,
  // which is exactly what "a bit stuttery" feels like at the controller.
  //
  // A queue turns that jitter into LATENCY instead. One frame of slack means a
  // frame arriving up to 16.7 ms late still gets its own refresh, because there
  // was a spare behind it. The slack is not free, and the page says what it
  // costs rather than hiding it.
  const queue = [];
  let target = 1;
  const MAX_TARGET = 3;
  // Waiting for the queue to rebuild after starving. Presenting during this is
  // what would make the buffer pointless: it would spend the slack the instant
  // it arrived, and starve again on the next late frame.
  let priming = true;
  let starved = 0;
  let starvedRecent = 0;
  let skipped = 0;
  let ticks = 0;
  let calmWindows = 0;

  const percentile = (values, q) => {
    if (!values.length) return 0;
    const sorted = [...values].sort((a, b) => a - b);
    return sorted[Math.floor((sorted.length - 1) * q)];
  };

  // Reconnecting, because a socket that closes once is a stream that is dead
  // for good otherwise. Observed exactly that: the connection dropped, the page
  // kept showing the last painted frame, and it looked like a freeze rather than
  // a disconnection. The server forces a key frame when somebody joins, so a
  // reconnection is a picture immediately rather than a wait for the next IDR.
  let video = null;
  let reconnects = 0;
  let connected = false;
  let stalls = 0;

  // How long without a frame before the connection is presumed dead.
  //
  // A reconnection that waits for `onclose` is not enough, and the reason is
  // measured: the server dropped a viewer on a broken pipe, its thread exited —
  // and the TLS proxy in front kept the browser's socket open, so the page was
  // never told. It sat on its last painted frame for good. A live socket that
  // has gone quiet looks exactly like a working one, so silence has to be the
  // signal.
  //
  // Two seconds is 120 frames: far beyond any hiccup, far below patience.
  const SILENCE_LIMIT = 2000;

  function connectVideo() {
    video = new WebSocket(socketUrl("/video"));
    video.binaryType = "arraybuffer";
    video.onopen = () => {
      connected = true;
      lastHeard = performance.now();
    };
    video.onclose = () => {
      connected = false;
      // The decoder is bound to a stream that has ended; the next one starts
      // from its own key frame with its own configuration.
      if (decoder !== null) {
        try {
          decoder.close();
        } catch {
          // Already closed by its own error handler; nothing to do.
        }
        decoder = null;
      }
      reconnects += 1;
      setTimeout(connectVideo, 500);
    };
    video.onerror = () => video?.close();
    video.onmessage = onVideoMessage;
  }

  const onVideoMessage = (event) => {
    // Liveness is BYTES arriving, not frames decoding. Putting this after the
    // "wait for a key frame" gate — which is where it was first — made the
    // socket look silent for the second or so before the first IDR, so the
    // watchdog closed it, and the reconnection did the same again: a livelock
    // that the test caught and reasoning had not.
    lastHeard = performance.now();
    const message = new Uint8Array(event.data);
    const capturedMicros = Number(new DataView(message.buffer).getBigUint64(0, true));
    const unit = message.subarray(8);
    const arrived = performance.now();

    // The two clocks are anchored on the first frame and never compared again.
    // Everything after is a difference of differences, so an offset between them
    // cancels out and only the CHANGE in transit time is reported.
    if (firstCapture === null) {
      firstCapture = capturedMicros / 1000;
      firstArrival = arrived;
    }
    const transit = arrived - firstArrival - (capturedMicros / 1000 - firstCapture);

    const isKey = hasIdr(unit);
    if (decoder === null) {
      if (!isKey) return; // a decoder cannot start mid-GOP
      const sps = findNal(unit, 7);
      if (!sps) return;
      const hex = (v) => v.toString(16).padStart(2, "0");
      const codec = `avc1.${hex(unit[sps + 1])}${hex(unit[sps + 2])}${hex(unit[sps + 3])}`;
      decoder = new VideoDecoder({
        output: (frame) => {
          const now = performance.now();
          const submitted = pipeline.shift();
          if (submitted !== undefined) {
            const total = now - submitted.at + submitted.transit;
            recent.push(total);
            if (recent.length > 240) recent.shift();
          }
          queue.push(frame);
          // Never carry more slack than asked for: beyond that it is pure
          // latency. This is also what keeps a backgrounded tab — where the
          // display never asks for anything — from accumulating seconds of
          // stale pictures.
          while (queue.length > target + 1) {
            queue.shift().close();
            skipped += 1;
          }
          shown += 1;
        },
        error: (error) => show(`decoder error: ${error}`, "bad"),
      });
      decoder.configure({ codec, optimizeForLatency: true });
    }

    if (lastArrival !== null) {
      gaps.push(arrived - lastArrival);
      if (gaps.length > 600) gaps.shift();
    }
    lastArrival = arrived;

    pipeline.push({ at: arrived, transit });
    decoder.decode(
      new EncodedVideoChunk({
        type: isKey ? "key" : "delta",
        timestamp: shown * 16_667,
        data: unit,
      }),
    );
  };

  connectVideo();

  const recent = [];

  // Paint on the display's own schedule. `painted` counts refreshes that had a
  // new picture; `repeated` counts those that had to show the previous one
  // again, which is exactly what stutter is made of.
  function paint() {
    requestAnimationFrame(paint);
    ticks += 1;
    adjustBuffer();

    if (priming) {
      // `> target`, not `>= target`: presenting has to LEAVE `target` behind it,
      // or the slack exists for exactly one refresh and buys nothing.
      if (queue.length > target) priming = false;
      else {
        repeated += 1;
        return;
      }
    }
    if (queue.length === 0) {
      starved += 1;
      starvedRecent += 1;
      repeated += 1;
      priming = true;
      return;
    }

    const frame = queue.shift();
    canvas.width = frame.displayWidth;
    canvas.height = frame.displayHeight;
    context.drawImage(frame, 0, 0);
    frame.close();
    painted += 1;
  }

  /// Grows the buffer when the path is jittery, shrinks it when it is calm.
  ///
  /// Adaptive rather than fixed because the right depth is a property of the
  /// network, not of the program: on a loopback zero is correct and a fixed
  /// buffer would be 16.7 ms of pure loss, while over Wi-Fi one or two is what
  /// stops the judder. Slow in both directions — growing costs a visible pause
  /// to refill, shrinking costs a dropped frame, so neither should happen over
  /// a blip.
  function adjustBuffer() {
    const WINDOW = 120; // two seconds at 60 Hz
    if (ticks % WINDOW !== 0) return;

    if (starvedRecent > 1 && target < MAX_TARGET) {
      target += 1;
      calmWindows = 0;
    } else if (starvedRecent === 0) {
      calmWindows += 1;
      if (calmWindows >= 3 && target > 0) {
        target -= 1;
        calmWindows = 0;
      }
    } else {
      calmWindows = 0;
    }
    starvedRecent = 0;
  }

  requestAnimationFrame(paint);

  /// Walks the start codes looking for a NAL of `kind`, returning where its
  /// first byte is. Written out rather than assuming a fixed offset: the
  /// parameter sets only precede the picture on IDR access units.
  function findNal(bytes, kind) {
    for (let i = 0; i + 3 < bytes.length; i++) {
      if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1) {
        if ((bytes[i + 3] & 0x1f) === kind) return i + 3;
        i += 2;
      }
    }
    return null;
  }
  const hasIdr = (bytes) => findNal(bytes, 5) !== null;

  // ── input ───────────────────────────────────────────────────────────────
  let input = null;
  function connectInput() {
    input = new WebSocket(socketUrl("/input"));
    input.binaryType = "arraybuffer";
    input.onclose = () => setTimeout(connectInput, 500);
    input.onerror = () => input?.close();
  }
  connectInput();

  const BUTTON = {
    A: 1 << 0, B: 1 << 1, X: 1 << 2, Y: 1 << 3, Z: 1 << 4,
    L: 1 << 5, R: 1 << 6, START: 1 << 7,
    D_UP: 1 << 8, D_DOWN: 1 << 9, D_LEFT: 1 << 10, D_RIGHT: 1 << 11,
  };
  const KEYS = {
    KeyX: "A", KeyC: "B", KeyS: "X", KeyD: "Y", KeyA: "Z",
    KeyQ: "L", KeyE: "R", Enter: "START",
  };
  const held = new Set();
  addEventListener("keydown", (event) => {
    if (event.code in KEYS || event.code.startsWith("Arrow")) event.preventDefault();
    held.add(event.code);
  });
  addEventListener("keyup", (event) => held.delete(event.code));
  addEventListener("blur", () => held.clear());

  // The state is sent every animation frame rather than on key events. A pad is
  // a LEVEL, not an edge: a dropped "keyup" would otherwise leave the character
  // running into a wall forever, and resending is 13 bytes.
  let sent = 0;
  function pumpInput() {
    requestAnimationFrame(pumpInput);
    if (input === null || input.readyState !== WebSocket.OPEN) return;

    let buttons = 0;
    for (const [code, name] of Object.entries(KEYS)) {
      if (held.has(code)) buttons |= BUTTON[name];
    }
    let x = (held.has("ArrowRight") ? 1 : 0) - (held.has("ArrowLeft") ? 1 : 0);
    let y = (held.has("ArrowUp") ? 1 : 0) - (held.has("ArrowDown") ? 1 : 0);

    const pad = navigator.getGamepads?.().find((p) => p);
    if (pad) {
      const dead = (v) => (Math.abs(v) < 0.15 ? 0 : v);
      x = dead(pad.axes[0] ?? 0) || x;
      y = -dead(pad.axes[1] ?? 0) || y;
      const map = ["A", "B", "X", "Y", "L", "R", "Z", null, null, "START"];
      map.forEach((name, index) => {
        if (name && pad.buttons[index]?.pressed) buttons |= BUTTON[name];
      });
    }

    const frame = new Uint8Array(13);
    const view = new DataView(frame.buffer);
    view.setUint16(0, buttons, true);
    frame[2] = 1; // player slot 1
    view.setInt16(3, Math.round(x * 32767), true);
    view.setInt16(5, Math.round(y * 32767), true);
    view.setInt16(7, 0, true);
    view.setInt16(9, 0, true);
    frame[11] = held.has("KeyQ") ? 255 : 0;
    frame[12] = held.has("KeyE") ? 255 : 0;
    input.send(frame);
    sent += 1;
  }
  requestAnimationFrame(pumpInput);

  // The watchdog. Runs on its own timer rather than inside the stats display,
  // so a change to what is shown can never quietly disarm it.
  setInterval(() => {
    if (!connected || lastHeard === null) return;
    if (performance.now() - lastHeard < SILENCE_LIMIT) return;
    stalls += 1;
    lastHeard = null;
    // Closing is what starts the reconnection: the same path a clean close
    // takes, so there is only one way back rather than two.
    video?.close();
  }, 500);

  setInterval(() => {
    if (decoder === null) {
      show("waiting for a key frame from the emulator…");
      return;
    }
    // Rates, not a percentage of refreshes. "72.5 % of refreshes had nothing
    // new" sounds alarming and means almost nothing: on a 120 Hz display a
    // perfect 60 fps stream leaves HALF the refreshes with nothing new by
    // construction, and this reported 72.5 % where the honest statement was
    // "33 painted of 60 sent". A number that cannot be read without knowing the
    // refresh rate is a number that will be misread.
    const elapsed = (performance.now() - firstArrival) / 1000;
    const rate = (count) => (elapsed > 0 ? count / elapsed : 0).toFixed(1);
    show(
      `silence recoveries   ${stalls}\n` +
        `buffer               ${target} frame${target === 1 ? "" : "s"} ` +
        `(+${(target * 16.7).toFixed(0)} ms), ${starved} starves, ${skipped} skipped\n` +
        `connection           ${connected ? "up" : "reconnecting…"}` +
        `${reconnects > 0 ? ` (${reconnects} drop${reconnects > 1 ? "s" : ""})` : ""}\n` +
        `sent by the server   60.0 /s (nominal)\n` +
        `arrived              ${rate(shown)} /s\n` +
        `painted              ${rate(painted)} /s\n` +
        `display refresh      ${rate(painted + repeated)} /s\n` +
        `pad frames           ${sent}\n` +
        `decoder queue        ${decoder.decodeQueueSize}\n` +
        `\n` +
        `gap between arrivals (16.7 ms is even):\n` +
        `  p50 ${percentile(gaps, 0.5).toFixed(1)} ms\n` +
        `  p95 ${percentile(gaps, 0.95).toFixed(1)} ms\n` +
        `  max ${percentile(gaps, 1).toFixed(1)} ms\n` +
        `\n` +
        `transit DRIFT since the first frame (not a latency):\n` +
        `  p50 ${percentile(recent, 0.5).toFixed(1)} ms\n` +
        `  p95 ${percentile(recent, 0.95).toFixed(1)} ms\n` +
        `  max ${percentile(recent, 1).toFixed(1)} ms\n` +
        `\n` +
        `The gap figures are what stutter is made of: a p95 far\n` +
        `above 16.7 ms means frames arrive in bursts, and no\n` +
        `amount of decoding speed can smooth that out.\n` +
        `\n` +
        `The drift figures can go NEGATIVE, and that is not a bug:\n` +
        `the two clocks are anchored on the first frame and only\n` +
        `their DIFFERENCE is reported, so a first frame that was\n` +
        `unusually slow makes every later one look early. It says\n` +
        `how transit CHANGED, never how long it takes.`,
    );
  }, 500);
</script>
