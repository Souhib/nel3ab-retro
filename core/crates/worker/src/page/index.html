    <!-- `viewport-fit=cover`: la page va jusqu'aux bords d'un téléphone à
         encoche, et c'est elle qui se tient hors des zones sûres, par les
         jetons `--zone-*` d'index.css. Sans lui, `env(safe-area-inset-*)`
         valait zéro partout et les marges écrites pour l'encoche ne servaient
         à rien (audit mobile, 22 novembre 2026). -->

    <!-- Ajoutée à l'écran d'accueil d'un iPhone, la salle s'ouvre sans la barre

         zones sûres. -->

    <title>nel3ab</title>
    <!-- Le thème choisi, posé AVANT la première image. Le script de la page est
         un module, lancé seulement après la lecture de tout le document: un
         choix contre le système s'y peignait d'abord aux couleurs du système
         (mesuré le 22 novembre 2026 sur la page construite: « nuit » sous un
         système clair commençait en craie, quatre chargements sur quatre).
         Un script classique dans l'en-tête tourne avant le corps. Il refait
         `storedTheme()` (src/lib/theme.ts) et un essai les compare valeur par
         valeur (`theme-en-tete.test.ts`). La politique du worker nomme chaque
         script par son empreinte (`script_policy`): il n'y a rien à ouvrir. -->
    <script>
      (function () {
        var choix = "auto";
        var anciens = {
          "instrument-sombre": "nuit",
          phosphore: "nuit",
          ambre: "nuit",
          "instrument-clair": "jour",
          indigo: "jour",
          famicom: "jour",
          gameboy: "jour",
        };
        try {
          var lu = localStorage.getItem("nel3ab:theme");
          if (lu === "auto" || lu === "nuit" || lu === "jour") choix = lu;
          else if (lu !== null && Object.prototype.hasOwnProperty.call(anciens, lu)) choix = anciens[lu];
        } catch (refus) {
          choix = "auto";
        }
        document.documentElement.dataset.theme = choix;
      })();
      /* effets: début. Les effets rétro du réglage de l'appareil, posés avant
         la première image (ADR D37). Écrit depuis `scriptEnTete()`
         (src/lib/effets.ts) par `N3_SALON_ECRIRE=1 npx vitest run
         src/lib/salon-retro.test.ts`, qui échoue si ce bloc n'est plus le
         sien. */
(function () {
  var effets = "mire-vide/d/o mire-charge/m/- palette/d/o cycle/m/- tramage/d/o titres/d/o texte-pixel/M/- coins/d/o ombres/d/o nettes/d/o icones/d/o pointeur/m/- chiffres/d/o curseur/d/o boutons/d/o start/m/o arrive/d/o lettres/m/- compteur/m/- sons/m/- secousse/M/- fondu/d/o mosaique/m/o iris/m/- tuiles/m/- coupure/m/- defile/M/- extinction/m/o paliers/m/- balayage/m/o balayage-tout/M/- grille/M/- vignette/m/- halo/d/o bave/m/- neige/m/o roulement/m/- scintille/M/- courbure/M/- fronton/d/o borne/m/- places/d/o initiales/m/- scores/d/o demo/m/- credit/d/o".split(" ");
  function appliquer() {
    var niveau = "conseille", sons = false;
    try {
      var lu = JSON.parse(localStorage.getItem("nel3ab:effets") || "null");
      if (lu && typeof lu === "object") {
        if (lu.niveau === "sobre" || lu.niveau === "conseille" || lu.niveau === "tout") niveau = lu.niveau;
        if (lu.sons === true) sons = true;
      }
    } catch (refus) {}
    try {
      var racine = document.documentElement;
      for (var i = 0; i < effets.length; i++) {
        var e = effets[i].split("/");
        var actif = e[0] === "sons" ? sons : niveau === "tout" ? true : niveau === "sobre" ? e[1] === "d" : e[2] === "o";
        racine.classList.toggle("fx-" + e[0], actif);
      }
      racine.setAttribute("data-effets", niveau);
      racine.setAttribute("data-sons", sons ? "oui" : "non");
    } catch (refus) {}
  }
  appliquer();
  try {
    window.nel3abEffets = { appliquer: appliquer };
    window.addEventListener("storage", function (e) {
      if (e.key === "nel3ab:effets" || e.key === null) appliquer();
    });
  } catch (refus) {}
})();
