# Same gates as CI, one round-trip earlier.
fail_fast: false
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]   # a ROM must never reach the repo

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: fmt
        name: cargo fmt
        entry: bash -c 'cd core && cargo fmt --all --check'
        language: system
        pass_filenames: false
      - id: clippy
        name: cargo clippy
        entry: bash -c 'cd core && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        pass_filenames: false
