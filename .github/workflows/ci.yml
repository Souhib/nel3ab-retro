name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main: a cancelled run's commits would never be tested, and the
  # replacing run only covers ITS own push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the secret scan sees the whole range

      # Blocking and unconditional: a leaked key is never "informational".
      #
      # v3 rather than v2 for the Node 24 runtime, and this one has a date on it:
      # GitHub removes Node 20 from its runners on 2026-09-16, after which v2
      # stops working with no opt-out. v3 changes the runtime and nothing else,
      # so it is a version bump rather than a migration.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # La VERSION est épinglée, et c'est une réparation de CI.
      #
      # Sans elle, l'action demande à l'API GitHub la liste des versions de
      # `just` et la parcourt page par page pour trouver la dernière. Le
      # 2026-08-17 cette liste a répondu 504, puis « aucune version ne
      # correspond »: deux messages différents pour la même panne, et deux
      # pipelines rouges sans qu'une ligne de code ait bougé. Un rouge qui n'a
      # rien à voir avec le commit est un rouge que l'oeil apprend à ignorer,
      # ce que ce projet ne peut pas se permettre (règle 7).
      #
      # À monter quand on a besoin d'une nouveauté de `just`, pas avant.
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      # `just lint` runs with --all-features, which builds the libavcodec shim's
      # build script — and a build script needs real headers, unlike clippy which
      # only analyses. Installing them here is what keeps `--all-features` honest:
      # the alternative, letting the shim silently not compile, would advertise a
      # lint pass over code nobody built.
      - name: GPU headers and the shader compiler the gated features need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavutil-dev libva-dev glslang-tools

      # The control plane and the page need their own toolchains. Without these,
      # `just check` cannot run them and the pipeline goes back to covering the
      # Rust third of the repository while claiming to cover it all.
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front

      # ONE recipe, deliberately. This used to list `fmt-check`, `lint` and
      # `test` one by one, and it drifted the moment `check` grew a step: the
      # Python service and the whole page were added to the local gate and CI
      # went on testing neither, under a comment claiming it ran the same thing.
      # Calling `check` itself is what makes that promise structural rather than
      # a habit. A recipe added to the gate cannot be forgotten here.
      - run: just check

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check

  # The prose, checked the same way the code is. `just docs` runs Zensical in
  # strict mode, which fails on a link or an anchor pointing at nothing.
  #
  # This is here because the logbook is 2800 lines and renaming a section is a
  # normal thing to do: without this job, every link to the old name dies quietly
  # and the first person to find out is a reader. Strict mode found two on its
  # first run, both in a page written the same afternoon.
  #
  # No GPU, no Rust, no cache needed — it is seconds, and it guards the document
  # the project rules call part of the work.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"
      # Caching off on purpose. The action caches Python dependencies keyed on a
      # lock file, and this repository has none: it warned that the cache "will
      # never get invalidated", which is the honest description of a cache that
      # would serve a stale Zensical forever. One tool from PyPI installs in
      # seconds; there is nothing here worth caching wrongly.
      #
      # Pinned to an exact version, unlike every other action here, because
      # setup-uv stopped publishing floating major tags at v8: there is no `v10`
      # to follow. Reverting this to `@v10` would silently resolve to nothing.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      # The PATH line is not decoration: `uv tool install` drops the executable
      # in ~/.local/bin, and whether that is already on the runner's PATH is the
      # runner image's business, not ours. Stating it costs one line and removes
      # a way for this job to fail for a reason that has nothing to do with the
      # documentation.
      - name: Install Zensical
        run: |
          uv tool install zensical
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just docs
