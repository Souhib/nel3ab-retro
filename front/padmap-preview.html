<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Les manettes</title>
    <link rel="icon" href="data:," />
    <style>
      /* Les rôles de la régie, pas des couleurs en dur : la planche suit le
         thème choisi, comme la salle (chantier manettes, 23 novembre 2026). */
      html {
        background: var(--fond);
        color: var(--encre);
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: var(--police-texte);
      }
      h1,
      h2,
      .reglages button,
      .taille {
        font-family: var(--police-pixel);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      h2 {
        margin: 24px 0 8px;
        font-size: 20px;
      }
      .reglages {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .reglages button {
        min-width: 44px;
        min-height: 44px;
        padding: 0 12px;
        border: 2px solid var(--filet);
        background: var(--plaque);
        color: var(--encre);
        font-size: 15px;
        cursor: pointer;
      }
      .reglages button[aria-pressed="true"] {
        border-color: var(--encre);
        box-shadow: inset 0 -4px 0 var(--encre);
      }
      .manettes {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
      .manette {
        border: 2px solid var(--filet);
        background: var(--plaque);
        padding: 12px;
        width: 860px;
        max-width: 100%;
        box-sizing: border-box;
      }
      .manette > p {
        margin: 4px 0;
        color: var(--legende);
        font-size: 14px;
      }
      .tailles {
        display: flex;
        gap: 16px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .taille {
        font-size: 13px;
        color: var(--legende);
      }
    </style>
  </head>
  <body>
    <div id="planche"></div>
    <script type="module" src="./padmap-preview.entry.tsx"></script>
  </body>
</html>
