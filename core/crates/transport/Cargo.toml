[package]
name = "nel3ab-transport"
description = "H.264, sound and pad state over plain WebSockets (ADR D9)."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
# Déjà dans l'arbre par transitivité: la page servie non compressée pèse
# 424 Kio contre 128 en gzip, et c'est la personne dont la liaison va mal qui
# paie la différence.
flate2 = "1"
# Pour l'empreinte des scripts en ligne que la CSP nomme. Calculée sur la page
# qu'on sert vraiment, donc elle ne peut pas diverger de ce qui part sur le fil.
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# Treize pour cent de moins que gzip sur la page, mesuré le 19 août 2026. Le
# coût de compression ne se paie qu'une fois, au premier envoi après un
# démarrage, parce que la page est un artefact figé compilé dans le binaire.
# En Rust pur, donc rien à installer sur la machine de construction.
brotli = { version = "8", default-features = false, features = ["std"] }
nel3ab-protocol = { path = "../protocol" }
thiserror.workspace = true
tracing.workspace = true

# A blocking WebSocket, deliberately. The worker is synchronous, and adopting an
# async runtime is an architectural decision that should be taken for its own
# reasons rather than smuggled in by a transport. Four players is four threads.
tungstenite = "0.30"

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
