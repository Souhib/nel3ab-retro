<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--MOT:accueil.onglet--></title>
<!--RETRO:EN-TETE-->
<!--RETRO:MOTS-->
<style>
  /* ─────────────────────────────────────────────────────────────────────
     LE SALON D'ARCADE (ADR D37, D41). La page d'accueil est une rangée de
     bornes: chaque salle ouverte est une borne, avec son jeu, qui choisit,
     qui regarde, et le panneau de ses quatre boutons START. Quand rien ne
     tourne, la mire « Hors antenne » prend la place de la rangée.

     Repris de la proposition « Scotch et feutre » du 22 novembre 2026, sans
     son thème: le meuble devient le panneau de commande d'une borne, le
     scotch une étiquette tapée. Les couleurs viennent toutes de la régie
     (`front/src/regie.css`); la page n'en déclare aucune.
     ───────────────────────────────────────────────────────────────── */
  /*__POLICES__*/
  /*__REGIE__*/
  /* Les effets rétro, communs à la salle et au salon (`front/src/effets.css`). */
  /*__EFFETS__*/
  /*__SALON__*/
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--fond); color: var(--encre);
    font: 400 18px/1.5 var(--police-texte);
    padding: clamp(.75rem, 2.5vh, 2rem) clamp(1rem, 3vw, 3rem);
  }
  .page { width: 100%; max-width: 1400px; margin-inline: auto; flex: 1;
          display: flex; flex-direction: column; gap: clamp(.9rem, 2vh, 1.4rem); }
  :focus-visible { outline: var(--focus-largeur) solid var(--focus); outline-offset: 3px; }

  /* L'heure du dernier relevé: une PREUVE DE VIE, pas une décoration. Elle
     avance tant que le salon répond, se fige et passe en alerte quand il se
     tait. Une valeur, pas une animation: le mouvement réduit la garde. */
  #horloge { font-family: var(--police-machine); font-variant-numeric: tabular-nums;
             color: var(--legende); letter-spacing: .08em; font-size: clamp(13px, 1.2vw, 16px); }
  #horloge[data-perdue="oui"] { color: var(--alerte); }

  /* ── La bannière de retour (?salle=fermee&n=N, ADR D41) ─────────────── */
  .retour { display: flex; align-items: center; gap: .6rem 1rem; flex-wrap: wrap;
            padding: .7rem 1rem; border-left: 6px solid var(--alerte);
            background: var(--creux); font-size: clamp(15px, 1.5vw, 19px); }
  .retour[hidden] { display: none; }
  .retour p { margin: 0; flex: 1 1 20ch; }

  /* ── L'accroche: ce qu'on vient faire, en une phrase ────────────────── */
  .accroche { margin: 0; font-family: var(--police-titre); font-weight: 400;
              font-size: clamp(24px, 3.4vw, 44px); line-height: 1.1; overflow-wrap: anywhere; }
  .sous-accroche { margin: 0; color: var(--legende); font-size: clamp(15px, 1.5vw, 19px); }
  .sous-accroche:empty { display: none; }

  /* ── La rangée de bornes ───────────────────────────────────────────── */
  .rangee { display: grid; gap: clamp(.8rem, 1.6vw, 1.4rem); flex: 1; align-content: start;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  body[data-vide="oui"] .rangee { display: flex; }
  /* Une borne. Le cadre est plein pour une salle qui joue, en pointillés
     pour une salle qui redémarre ou ne répond pas: elle garde sa place dans
     la rangée, sans bouton (audit P10). */
  article.salle { display: flex; flex-direction: column; gap: .7rem; min-width: 0;
                  padding: clamp(.8rem, 1.6vw, 1.2rem); background: var(--plaque);
                  border: 2px solid var(--trait); border-radius: var(--rayon); }
  article.salle[data-etat="redemarre"], article.salle[data-etat="muette"] {
    border-style: dashed; background: var(--creux); }
  .tete { display: grid; grid-template-columns: auto 1fr; gap: .8rem; align-items: start; }
  /* La cartouche: la jaquette quand le salon la sert (D45), sinon une
     cartouche dessinée au nom de la console. Pâlie quand la salle se tait. */
  .cartouche { width: clamp(64px, 7vw, 92px); aspect-ratio: 3 / 4; display: grid; place-items: end center;
               padding: 4px; background: var(--creux); border: 2px solid var(--trait);
               border-top-width: 10px; overflow: hidden; position: relative; }
  .cartouche img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cartouche img[hidden] { display: none; }
  .cartouche-console { position: relative; font-family: var(--police-titre); font-size: 11px;
                       line-height: 1.1; text-align: center; color: var(--legende); }
  article.salle[data-etat="redemarre"] .cartouche,
  article.salle[data-etat="muette"] .cartouche { opacity: .55; }
  .corps { min-width: 0; display: flex; flex-direction: column; gap: .15rem; }
  .titre { margin: 0; font-family: var(--police-titre); font-weight: 400;
           font-size: clamp(16px, 1.5vw, 20px); line-height: 1.2; }
  .places-mot, .gens { margin: 0; font-size: clamp(14px, 1.3vw, 17px); color: var(--legende); }
  .places-mot:empty, .gens:empty { display: none; }
  /* RÈGLE TENUE COMME UNE CONTRAINTE: le jeu est la plus grosse ligne de
     texte d'une borne. C'est ce qu'on vient lire de loin. */
  .jeu { margin: 0; font-weight: 700; font-size: clamp(20px, 2.2vw, 30px); line-height: 1.1;
         overflow-wrap: anywhere; }
  .jeu[data-menu="oui"] { font-weight: 400; color: var(--legende); font-size: clamp(16px, 1.5vw, 20px); }

  /* Le panneau de commande d'une borne: les quatre START, puis Regarder. */
  .commande { display: flex; flex-direction: column; gap: .6rem; padding-top: .6rem;
              border-top: 2px solid var(--trait); }
  .starts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4rem;
            margin: 0; padding: 0; list-style: none; }
  .start { display: flex; flex-direction: column; align-items: center; gap: .3rem; min-width: 0;
           min-height: 44px; padding: .25rem .1rem; color: var(--encre); text-decoration: none;
           border-radius: var(--rayon); }
  a.start:hover .start-mot, a.start:focus-visible .start-mot { color: var(--signal); }
  .start-mot { font-family: var(--police-titre); font-size: 13px; color: var(--legende);
               max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* La place conseillée: le seul bouton plein de la page (audit P13). */
  a.start[data-plein] { background: var(--bouton-plein-fond); }
  a.start[data-plein] .start-mot { color: var(--bouton-plein-encre); }
  a.start[data-plein]:hover { background: var(--bouton-plein-survol); }
  .start .etiquette { font-size: 12px; }
  .regarder { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px;
              padding: .3rem 1.1rem; font-family: var(--police-titre); text-decoration: none;
              color: var(--bouton-cadre-encre); border: 2px solid var(--bouton-cadre-trait);
              border-radius: var(--rayon); }
  .regarder:hover { background: var(--survol); }
  .regarder[hidden] { display: none; }

  /* Un emplacement éteint garde sa place dans la rangée: la machine a trois
     salles, les cacher laissait croire qu'elle n'en a qu'une. */
  .eteint { display: flex; flex-direction: column; justify-content: center; gap: .6rem;
            padding: clamp(.8rem, 1.6vw, 1.2rem); border: 2px dashed var(--trait);
            border-radius: var(--rayon); color: var(--legende); }
  .eteint .titre { color: var(--legende); }
  .eteint button { align-self: flex-start; }

  /* ── Hors antenne: la mire, quand rien ne tourne ───────────────────── */
  /* Les barres viennent de l'effet « mire-vide » du socle (`.rt-mire`); le
     cycle, le balayage et la courbure aussi, chacun à son niveau. Le cadre du
     texte reste opaque: on ne mesure pas un contraste sur des barres. */
  .vide { flex: 1; display: grid; place-items: center; position: relative; overflow: hidden;
          min-height: 40vh; border: 2px solid var(--trait); }
  .vide-bloc { position: relative; z-index: 1; text-align: center; background: var(--fond);
               border: 2px solid var(--trait); padding: clamp(1.2rem, 4vh, 2.4rem) clamp(1.2rem, 4vw, 3rem); }
  .vide-titre { margin: 0 0 .4rem; font-family: var(--police-titre); text-transform: uppercase;
                letter-spacing: .12em; font-size: clamp(26px, 4vw, 52px); }
  .vide-mot { margin: 0 auto; max-width: 44ch; color: var(--legende); font-size: clamp(15px, 1.5vw, 19px); }
  .rt-demo.demo-mot { margin: .6rem 0 0; color: var(--signal); font-family: var(--police-titre); }

  /* ── Le panneau du salon, en bas ───────────────────────────────────── */
  .panneau { display: flex; align-items: center; gap: .6rem 1.4rem; flex-wrap: wrap;
             border-top: 2px solid var(--trait); padding-top: .9rem; }
  .plein, .cadre { cursor: pointer; border-radius: var(--rayon); font-family: var(--police-titre); }
  .plein { min-height: 52px; padding: .6rem 1.6rem; font-size: clamp(16px, 1.6vw, 20px);
           color: var(--bouton-plein-encre); background: var(--bouton-plein-fond);
           border: 2px solid var(--bouton-plein-fond); }
  .plein:hover:not(:disabled) { background: var(--bouton-plein-survol); border-color: var(--bouton-plein-survol); }
  .cadre { min-height: 44px; padding: .4rem 1.1rem; font-size: clamp(14px, 1.3vw, 17px);
           color: var(--bouton-cadre-encre); background: transparent; border: 2px solid var(--bouton-cadre-trait); }
  .cadre:hover:not(:disabled) { background: var(--survol); }
  .plein:disabled, .cadre:disabled { cursor: not-allowed; opacity: .6; }
  .panneau [hidden] { display: none; }
  .rt-start { margin: 0; text-transform: uppercase; }
  /* Le crédit du socle ne passe pas à la ligne; à 320 px, « Salles ouvertes
     2 · Places libres 2 » débordait de 37 px (salon-navigateur, 24 novembre
     2026). Ici il le peut, entre ses mots. */
  .rt-credit { margin: 0 0 0 auto; text-transform: uppercase; color: var(--legende); font-size: 14px;
               white-space: normal; }
  .mot { margin: 0; font-size: clamp(14px, 1.4vw, 18px); color: var(--legende); }
  .mot[data-refus="oui"] { color: var(--alerte); }
  .mot:empty { display: none; }
  /* Lue par un lecteur d'écran, pas montrée: les bornes disent déjà la même chose. */
  .annonce { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
             overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

  @media (max-width: 620px) {
    .starts { gap: .25rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="rt-pointeur">
  <main class="page">
    <header class="entete">
      <!--RETRO:BANDEAU /-->
      <span id="horloge" title="<!--MOT:accueil.horloge-->">--:--:--</span>
    </header>

    <div class="retour" id="retour" role="status" hidden>
      <p id="retour-mot"></p>
      <button type="button" class="cadre" id="retour-fermer"><!--MOT:accueil.compris--></button>
    </div>

    <h1 class="accroche" id="accroche"><!--MOT:entete.salles--></h1>
    <p class="sous-accroche" id="sous-accroche"></p>

    <!-- La liste n'est pas une région vivante: réécrite toutes les cinq secondes,
         elle se faisait relire sans changer (A11Y-08, audit du 21 novembre 2026).
         Ce qui change vraiment est dit en une phrase, dans la ligne d'annonce. -->
    <section class="rangee" id="salles" data-ancre="salles" aria-label="<!--MOT:entete.salles-->"></section>
    <p class="annonce" id="annonce" role="status"></p>

    <div class="panneau" id="panneau">
      <button type="button" class="plein" id="ouvrir" hidden><!--MOT:accueil.ouvrirUne--></button>
      <button type="button" class="plein" id="recharger" hidden><!--MOT:accueil.recharger--></button>
      <p class="rt-start" id="start" hidden><!--MOT:accueil.start--></p>
      <p class="mot" id="mot" data-texte></p>
      <p class="rt-credit" id="credit"></p>
    </div>

    <!-- Le réglage des effets rétro de cet appareil, le même que dans le menu
         d'une salle (ADR D37). -->
    <!--RETRO:REGLAGE-->
  </main>

<!--RETRO:AIN-->
<script>
  const $ = (id) => document.getElementById(id);
  const liste = $("salles");
  const annonce = $("annonce");
  const accroche = $("accroche");
  const sousAccroche = $("sous-accroche");
  const bouton = $("ouvrir");
  const recharger = $("recharger");
  const start = $("start");
  const mot = $("mot");
  const credit = $("credit");
  const horloge = $("horloge");

  /** Le paquet du salon (ADR D41): Aïn et les gestes d'arcade du socle. Une
   * page sans lui (paquet refusé, script bloqué) reste juste: elle ne joue
   * aucune scène. */
  const ain = (quoi) => { try { window.nel3abAin?.scene(quoi); } catch {} };
  const arcade = window.nel3abSalon ?? null;
  /** Les mots de la page (`mots.ts`, posés par `retro.py`). */
  const mots = window.nel3abMots;

  /** Écrit un texte seulement s'il change: réécrire le même texte remplace
   * quand même son noeud, et un lecteur d'écran peut le relire (A11Y-08). */
  function ecrire(noeud, texte) { if (noeud.textContent !== texte) noeud.textContent = texte; }
  function poser(noeud, nom, valeur) {
    if (valeur === null) { if (noeud.hasAttribute(nom)) noeud.removeAttribute(nom); }
    else if (noeud.getAttribute(nom) !== valeur) noeud.setAttribute(nom, valeur);
  }
  function cacher(noeud, cache) { if (noeud.hidden !== cache) noeud.hidden = cache; }
  function element(balise, classe, texte) {
    const el = document.createElement(balise);
    if (classe) el.className = classe;
    if (texte !== undefined) el.textContent = texte;
    return el;
  }

  const NOMBRES = mots("accueil.nombres").split(" ");
  const deux = (n) => String(n).padStart(2, "0");

  /** « 1 h 06 », « 12 min », « moins d'une minute ». On tronque: « depuis »
   * compte le temps écoulé, et deux minutes au bout de 90 secondes feraient
   * croire à une partie plus avancée qu'elle ne l'est. */
  function duree(secondes) {
    if (secondes < 60) return mots("commun.moinsDUneMinute");
    const minutes = Math.floor(secondes / 60);
    if (minutes < 60) return `${minutes} min`;
    return `${Math.floor(minutes / 60)} h ${deux(minutes % 60)}`;
  }

  /** L'état d'une salle pour la rangée. Une salle qui redémarre ou se tait
   * n'est ni ouverte ni fermée: elle garde sa borne, sans bouton (P10). */
  function etatDe(salle) {
    if (salle.redemarre) return "redemarre";
    if (!salle.ouverte) return "fermee";
    if (salle.repond === false) return "muette";
    return "ouverte";
  }

  /** Les quatre places d'une salle qui répond, ou rien quand le salon ne les
   * connaît pas. `sieges` absent: personne n'est relié au salon dans cette
   * salle; quatre places libres au compte du worker se disent quand même.
   * Une place tenue sans nom est prise par « quelqu'un ». */
  function placesDe(salle) {
    if (etatDe(salle) !== "ouverte") return null;
    if (!Array.isArray(salle.sieges)) {
      return salle.places === 4
        ? [1, 2, 3, 4].map((port) => ({ port, nom: null, libre: true }))
        : null;
    }
    const par = new Map(salle.sieges.map((s) => [s.port, s]));
    return [1, 2, 3, 4].map((port) => {
      const siege = par.get(port);
      const nom = siege?.nom ?? null;
      const tenu = siege?.tenu === true;
      return { port, nom: nom ?? (tenu ? mots("commun.quelquun") : null), libre: nom === null && !tenu };
    });
  }

  /** Le lien d'une place précise: on entre pour jouer, à CETTE place (D41). */
  const lienPlace = (salle, port) => `${salle.chemin}?entrer=jouer&place=${port}`;

  /** La salle qu'on vient d'ouvrir d'ici, tant qu'elle n'est pas refermée. */
  let ouverteIci = null;
  /** Une ouverture en cours: un seul POST par geste (clic, Entrée ou Start). */
  let enCours = false;
  /** Combien de relevés de suite ont manqué, et l'heure du dernier réussi. */
  let rates = 0;
  let dernierReleve = null;
  /** Ce que la liste montrait au tour d'avant, par numéro de salle. */
  let vues = null;
  let derniereListe = [];

  /** La place conseillée: le seul bouton plein de la page. La salle qu'on
   * vient d'ouvrir d'abord; sinon celle où il y a déjà du monde, pour
   * rejoindre ses amis plutôt que d'allumer une autre salle (P13); à égalité
   * la plus petite. Sa première place libre. */
  function conseillee(salles) {
    const candidates = salles
      .map((salle) => ({ salle, places: placesDe(salle) }))
      .filter(({ places }) => places && places.some((p) => p.libre));
    if (candidates.length === 0) return null;
    const ici = candidates.find(({ salle }) => salle.numero === ouverteIci);
    const choisie = ici ?? candidates.sort((a, b) =>
      (b.salle.gens?.length ?? 0) - (a.salle.gens?.length ?? 0) || a.salle.numero - b.salle.numero)[0];
    const place = choisie.places.find((p) => p.libre);
    return { salle: choisie.salle, port: place.port, libres: choisie.places.filter((p) => p.libre).length };
  }

  /** Ce qui a changé depuis le tour d'avant, en phrases: ouverte, fermée, autre jeu. */
  function changements(salles) {
    const dites = [];
    for (const salle of salles) {
      const avant = vues?.get(salle.numero);
      if (!avant) continue;
      const n = salle.numero;
      if (salle.ouverte && !avant.ouverte) dites.push(mots("accueil.vientDeSOuvrir", { n }));
      else if (!salle.ouverte && avant.ouverte) dites.push(mots("accueil.sEstFermee", { n }));
      else if (salle.ouverte && (salle.jeu ?? null) !== avant.jeu) {
        dites.push(salle.jeu ? mots("accueil.passeA", { n, jeu: salle.jeu })
          : mots("accueil.revientAuMenu", { n }));
      }
    }
    return dites;
  }

  // ── Une borne ─────────────────────────────────────────────────────────
  function borne(salle) {
    const art = element("article", "salle");
    art.dataset.salle = String(salle.numero);
    const tete = element("div", "tete");
    const cartouche = element("div", "cartouche");
    cartouche.setAttribute("aria-hidden", "true");
    const image = element("img");
    image.alt = "";
    image.hidden = true;
    // Une jaquette absente (404) laisse la cartouche dessinée.
    image.addEventListener("error", () => { image.hidden = true; });
    image.addEventListener("load", () => { image.hidden = false; });
    cartouche.append(image, element("span", "cartouche-console"));
    const corps = element("div", "corps");
    const titre = element("h2", "titre");
    titre.id = `titre-${salle.numero}`;
    art.setAttribute("aria-labelledby", titre.id);
    corps.append(titre, element("p", "places-mot"), element("p", "jeu"), element("p", "gens"));
    tete.append(cartouche, corps);
    const commande = element("div", "commande");
    const starts = element("ol", "starts");
    starts.setAttribute("aria-label", mots("accueil.lesPlaces", { n: salle.numero }));
    commande.append(starts, element("a", "regarder", mots("accueil.regarder")));
    art.append(tete, commande);
    return art;
  }

  function etiquette(nom, port) {
    const el = element("span", "etiquette", nom);
    if (port) el.style.setProperty("--rt-joueur", `var(--p${port})`);
    return el;
  }

  /** Les gens d'une borne: qui choisit le jeu, qui regarde, en étiquettes. */
  function remplirGens(ligne, salle) {
    const cle = JSON.stringify([salle.chef ?? null, salle.regardent ?? []]);
    if (ligne.dataset.cle === cle) return;
    ligne.dataset.cle = cle;
    ligne.replaceChildren();
    // Des espaces entre les étiquettes et les mots: un lecteur d'écran lit
    // le texte, et « nourchoisit » n'est pas un mot.
    if (salle.chef) ligne.append(etiquette(salle.chef), ` ${mots("accueil.choisit")} `);
    const regardent = salle.regardent ?? [];
    if (regardent.length > 0) {
      for (const nom of regardent) ligne.append(etiquette(nom), " ");
      ligne.append(mots(regardent.length > 1 ? "accueil.regardent" : "accueil.regarde"));
    }
  }

  /** Les quatre START d'une borne. Une place prise porte l'étiquette de son
   * joueur et s'allume à sa couleur; une place libre est un lien qui la
   * prend; la place conseillée est le seul bouton plein. Refaits seulement
   * quand quelque chose change. */
  function remplirStarts(ol, salle, places, conseil) {
    const plein = conseil?.salle.numero === salle.numero ? conseil.port : 0;
    const cle = JSON.stringify([places, salle.chemin, plein]);
    if (ol.dataset.cle === cle) return;
    const avant = ol.dataset.noms ? JSON.parse(ol.dataset.noms) : null;
    ol.dataset.cle = cle;
    ol.dataset.noms = JSON.stringify(places ? places.map((p) => p.nom) : null);
    ol.replaceChildren();
    for (const port of [1, 2, 3, 4]) {
      const place = places?.[port - 1] ?? null;
      const libre = place?.libre === true;
      const cible = libre ? element("a", "start") : element("span", "start");
      cible.dataset.place = String(port);
      const rond = element("span", "rt-bouton-start", `${port}P`);
      rond.setAttribute("aria-hidden", "true");
      if (place && !libre) rond.style.setProperty("--rt-joueur", `var(--p${port})`);
      else rond.dataset.libre = "";
      cible.append(rond);
      if (libre) {
        cible.href = lienPlace(salle, port);
        cible.append(element("span", "start-mot",
          plein === port ? mots("accueil.prendreLaPlace", { place: port }) : mots("accueil.prendre")));
        cible.setAttribute("aria-label", mots("accueil.prendreLaPlaceDe", { place: port, n: salle.numero }));
        if (plein === port) { cible.dataset.plein = ""; cible.dataset.ancre = "place-libre"; }
      } else if (place) {
        cible.append(etiquette(place.nom, port));
        cible.setAttribute("aria-label", mots("accueil.placeDe", { place: port, nom: place.nom }));
        // Une place qui se remplit SOUS les yeux s'allume une fois (effet
        // « arrive »); une page qui s'ouvre sur une salle pleine ne bouge pas.
        if (avant && avant[port - 1] === null) {
          cible.dataset.arrive = "";
          cible.dataset.joue = "";
          setTimeout(() => cible.removeAttribute("data-joue"), 1300);
        }
      } else {
        cible.setAttribute("aria-label", mots("accueil.placeInconnue", { place: port }));
      }
      const li = element("li");
      li.append(cible);
      ol.append(li);
    }
  }

  function remplirBorne(art, salle, conseil) {
    const etat = etatDe(salle);
    poser(art, "data-etat", etat);
    const n = salle.numero;
    ecrire(art.querySelector(".titre"), etat === "redemarre" ? mots("accueil.redemarre", { n })
      : etat === "muette" ? mots("accueil.muette", { n })
      : salle.ouverte_depuis == null ? mots("accueil.ouverte", { n })
      : mots("accueil.ouverteDepuis", { n, duree: duree(salle.ouverte_depuis) }));

    const places = placesDe(salle);
    const libres = places ? places.filter((p) => p.libre).length : null;
    ecrire(art.querySelector(".places-mot"),
      etat !== "ouverte" ? ""
        : libres === null ? mots("accueil.placesQuandElleRepond")
        : libres === 0 ? mots("accueil.quatrePrises")
        : libres === 1 ? mots("accueil.unePlaceLibre")
        : mots("accueil.placesLibres", { nombre: `${NOMBRES[libres][0].toUpperCase()}${NOMBRES[libres].slice(1)}` }));

    const jeu = art.querySelector(".jeu");
    const titreJeu = salle.jeu ?? (etat === "redemarre" ? salle.dernier_jeu?.titre : null) ?? null;
    ecrire(jeu, titreJeu ?? mots("accueil.aucunJeu"));
    poser(jeu, "data-menu", titreJeu ? "non" : "oui");
    remplirGens(art.querySelector(".gens"), salle);

    ecrire(art.querySelector(".cartouche-console"), salle.console ?? "");
    const image = art.querySelector(".cartouche img");
    const jaquette = salle.cle ? `/api/catalogue/art/${encodeURIComponent(salle.cle)}` : null;
    if (jaquette === null) {
      if (image.hasAttribute("src")) { image.removeAttribute("src"); image.hidden = true; }
    } else if (image.getAttribute("src") !== jaquette) image.setAttribute("src", jaquette);

    remplirStarts(art.querySelector(".starts"), salle, places, conseil);
    const regarder = art.querySelector(".regarder");
    poser(regarder, "href", `${salle.chemin}?entrer=regarder`);
    poser(regarder, "aria-label", mots("accueil.regarderLaSalle", { n }));
    // Rien à regarder dans une salle qui redémarre ou se tait: aucun bouton.
    cacher(regarder, etat !== "ouverte");
  }

  function emplacementEteint(salle) {
    const bloc = element("div", "eteint");
    bloc.dataset.salle = String(salle.numero);
    const ouvrir = element("button", "cadre", mots("accueil.ouvrirLaSalle", { n: salle.numero }));
    ouvrir.type = "button";
    ouvrir.dataset.ouvrir = String(salle.numero);
    ouvrir.addEventListener("click", () => ouvrirSalle(salle.numero));
    bloc.append(element("h2", "titre", mots("accueil.eteinte", { n: salle.numero })), ouvrir);
    return bloc;
  }

  // ── La mire ───────────────────────────────────────────────────────────
  function mire() {
    const bloc = element("div", "vide rt-mire rt-bombe");
    const dedans = element("div", "vide-bloc");
    dedans.append(
      element("p", "vide-titre rt-bave", mots("accueil.horsAntenne")),
      element("p", "vide-mot", mots("accueil.rienNeTourne")),
      // Ce que la démo montre quand personne ne touche au salon (niveau « tout »).
      element("p", "rt-demo demo-mot", mots("accueil.demo")),
    );
    bloc.append(dedans);
    try { arcade?.poserCalquesAttente(bloc); } catch {}
    return bloc;
  }

  /** Le mode démo ne joue qu'à zéro salle (`surInactivite` du socle: niveau
   * « tout », jamais en mouvement réduit). */
  let finirDemo = null;
  function armerDemo(armer) {
    if (armer && !finirDemo && arcade) {
      finirDemo = arcade.surInactivite(document.body, 30000, { lancer: () => ain("demo") });
    } else if (!armer && finirDemo) { finirDemo(); finirDemo = null; }
  }

  /** La boucle d'attention à zéro salle (`nel3abSalon.surAttention`) :
   * « attente » à 2,5 s puis toutes les 6 s, trois tours, puis « dort ».
   * Armée une fois par passage à zéro salle ; un geste l'arrête jusqu'au
   * prochain. Une salle qui s'ouvre la coupe. */
  let finirAttention = null;
  function armerAttention(armer) {
    if (armer && !finirAttention && arcade?.surAttention) {
      finirAttention = arcade.surAttention((scene) => ain(scene));
    } else if (!armer && finirAttention) { finirAttention(); finirAttention = null; }
  }

  // ── Le dessin d'un tour ───────────────────────────────────────────────
  function dessiner(salles) {
    derniereListe = salles;
    const dites = changements(salles);
    if (dites.length > 0) annonce.textContent = dites.join(". ");
    vues = new Map(salles.map((s) => [s.numero, { ouverte: s.ouverte, jeu: s.jeu ?? null }]));
    // Une salle ouverte d'ici puis refermée ne nomme plus l'accroche.
    const ici = salles.find((s) => s.numero === ouverteIci);
    if (ici && etatDe(ici) === "fermee" && !enCours) ouverteIci = null;

    const zero = salles.every((s) => etatDe(s) === "fermee");
    const conseil = rates >= 2 ? null : conseillee(salles);
    poser(document.body, "data-vide", zero ? "oui" : "non");

    // La rangée n'entre qu'une fois : quand elle remplace la mire, en un
    // fondu de 250 ms (plan salon, salon-accueil#15). Au premier rendu, et
    // en mouvement réduit, elle est là d'un coup.
    const avaitMire = liste.querySelector(".vide") !== null;
    if (zero) {
      if (!liste.querySelector(".vide")) liste.replaceChildren(mire());
    } else {
      liste.querySelector(".vide")?.remove();
      const reduit = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (avaitMire && !reduit)
        liste.animate?.([{ opacity: 0 }, { opacity: 1 }], { duration: 250, easing: "ease-out" });
      // Les bornes sont MISES À JOUR, pas refaites: refaire relance les
      // animations et fait tomber le focus du clavier en pleine navigation.
      const vieilles = new Map([...liste.children].map((n) => [n.dataset.salle, n]));
      let precedent = null;
      for (const salle of salles) {
        const ferme = etatDe(salle) === "fermee";
        let noeud = vieilles.get(String(salle.numero));
        vieilles.delete(String(salle.numero));
        if (!noeud || (ferme ? !noeud.classList.contains("eteint") : noeud.tagName !== "ARTICLE")) {
          noeud?.remove();
          noeud = ferme ? emplacementEteint(salle) : borne(salle);
        }
        if (!ferme) remplirBorne(noeud, salle, conseil);
        const attendu = precedent === null ? liste.firstChild : precedent.nextSibling;
        if (attendu !== noeud) liste.insertBefore(noeud, attendu);
        precedent = noeud;
      }
      for (const reste of vieilles.values()) reste.remove();
    }
    armerDemo(zero && rates < 2);
    armerAttention(zero && rates < 2);
    dire(salles, zero, conseil);
  }

  /** L'accroche, le panneau et le crédit. Une phrase n'est dite qu'une fois
   * par vue: « tu choisiras le jeu » vit dans la sous-accroche seulement. */
  function dire(salles, zero, conseil) {
    const fige = rates >= 2;
    const ouverte = salles.find((s) => s.numero === ouverteIci && etatDe(s) !== "fermee") ?? null;
    let titre;
    let sous = "";
    if (fige) {
      const h = dernierReleve ?? new Date();
      titre = mots("accueil.listeDate", { h: h.getHours(), mm: deux(h.getMinutes()) });
      sous = mots("accueil.plusAJour");
    } else if (ouverte) {
      titre = conseil && conseil.salle.numero === ouverte.numero
        ? mots("accueil.ouverteTaPlace", { n: ouverte.numero, place: conseil.port })
        : mots("accueil.estOuverte", { n: ouverte.numero });
      sous = mots("accueil.choisirasDedans");
    } else if (zero) {
      titre = mots("accueil.aucuneCeSoir");
      sous = mots("accueil.ouvreUne");
    } else if (conseil) {
      titre = conseil.libres === 1
        ? mots("accueil.uneTAttend", { n: conseil.salle.numero })
        : mots("accueil.tAttendent", { n: conseil.salle.numero, nombre: NOMBRES[conseil.libres] });
      sous = mots("accueil.ouUneAutre");
    } else if (salles.some((s) => placesDe(s) !== null)) {
      titre = mots("accueil.toutesPrises");
    } else {
      titre = mots("accueil.placesQuandUneRepond");
    }
    ecrire(accroche, titre);
    ecrire(sousAccroche, sous);

    cacher(recharger, !fige);
    cacher(bouton, !zero || fige);
    bouton.disabled = enCours;
    // Entrée et Start n'ouvrent une salle qu'à zéro salle: en ouvrir une
    // autre allume un second émulateur sur la carte graphique commune.
    cacher(start, !zero || fige);
    if (!mot.dataset.refus) {
      ecrire(mot, enCours ? mots("accueil.sOuvre")
        : ouverte && placesDe(ouverte) === null ? mots("accueil.pasEncoreRepondu") : "");
    }
    const jouent = salles.filter((s) => etatDe(s) === "ouverte");
    const places = jouent.map(placesDe);
    const libres = jouent.length > 0 && places.every(Boolean)
      ? places.reduce((n, p) => n + p.filter((x) => x.libre).length, 0) : null;
    // Les places libres seulement quand toutes sont connues: un total qui
    // en oublie une salle muette dirait moins de places qu'il n'y en a.
    ecrire(credit, libres === null ? mots("accueil.credit", { n: jouent.length })
      : mots("accueil.creditLibres", { n: jouent.length, libres }));
  }

  // ── Le relevé ─────────────────────────────────────────────────────────
  function marquer(perdue) {
    if (!perdue) {
      dernierReleve = new Date();
      const d = dernierReleve;
      horloge.textContent = `${deux(d.getHours())}:${deux(d.getMinutes())}:${deux(d.getSeconds())}`;
    }
    horloge.dataset.perdue = perdue ? "oui" : "non";
  }

  async function relire() {
    try {
      const reponse = await fetch("/api/salles", { cache: "no-store" });
      if (!reponse.ok) throw new Error(String(reponse.status));
      const salles = await reponse.json();
      const revient = rates >= 2;
      rates = 0;
      marquer(false);
      delete mot.dataset.refus;
      dessiner(salles);
      if (revient) ain("rebrancher");
      expliquerRetour(salles);
    } catch {
      // Une liste qui ne se met plus à jour a EXACTEMENT l'air d'une liste
      // fraîche: au bout de deux tours, l'accroche le dit et Aïn décroche.
      rates += 1;
      if (rates === 2) { marquer(true); dessiner(derniereListe); ain("decroche"); }
    }
  }

  // ── Ouvrir une salle (D17) ────────────────────────────────────────────
  async function ouvrirSalle(numero) {
    if (enCours) return;
    enCours = true;
    delete mot.dataset.refus;
    ain("ouvre");
    dessiner(derniereListe);
    for (const b of document.querySelectorAll("[data-ouvrir]")) b.disabled = true;
    try {
      const reponse = await fetch("/api/salles", numero == null ? { method: "POST" } : {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ numero }),
      });
      const dit = await reponse.json().catch(() => ({}));
      if (reponse.ok) {
        // La page ne part plus vers la salle: elle arrive dans la rangée, et
        // sa première place devient le bouton plein dès qu'elle répond.
        ouverteIci = dit.numero ?? numero ?? null;
        ain("pret");
      } else {
        mot.dataset.refus = "oui";
        ecrire(mot, typeof dit.detail === "string" ? dit.detail : mots("accueil.refusOuvrir"));
        ain("refus");
      }
    } catch {
      mot.dataset.refus = "oui";
      ecrire(mot, mots("commun.sansReponse"));
      ain("refus");
    }
    enCours = false;
    for (const b of document.querySelectorAll("[data-ouvrir]")) b.disabled = false;
    // Un refus reste affiché jusqu'au relevé suivant, qui l'efface; une
    // salle ouverte se montre tout de suite.
    if (mot.dataset.refus === "oui") dessiner(derniereListe);
    else await relire();
  }
  bouton.addEventListener("click", () => ouvrirSalle(null));
  recharger.addEventListener("click", () => location.reload());

  // ── Le retour d'une salle (?salle=fermee&n=N, K39) ────────────────────
  const adresse = new URLSearchParams(location.search);
  let retourDe = null;
  if (adresse.get("salle") === "fermee") {
    const n = Number(adresse.get("n"));
    retourDe = Number.isInteger(n) && n >= 1 ? n : 0;
    // L'adresse est nettoyée tout de suite: recharger ne doit pas reproduire
    // une nouvelle qui date d'il y a dix minutes.
    history.replaceState(null, "", location.pathname);
  }
  const RAISONS = { inactivite: "accueil.fermeeInactivite", panne: "accueil.fermeePanne" };
  /** Dit pourquoi on est revenu ici, une fois, quand la liste le confirme. */
  function expliquerRetour(salles) {
    if (retourDe === null) return;
    const salle = salles.find((s) => s.numero === retourDe);
    const etat = salle ? etatDe(salle) : null;
    let phrase;
    if (etat === "redemarre") {
      phrase = mots("accueil.revient", { n: salle.numero });
      ain("redemarre");
    } else if (etat === "muette") {
      phrase = mots("accueil.neRepondPas", { n: salle.numero });
      ain("decroche");
    } else if (etat === "ouverte") {
      phrase = mots("accueil.deNouveau", { n: salle.numero });
    } else {
      phrase = salle
        ? `${mots(Object.hasOwn(RAISONS, salle.fermee_pour) ? RAISONS[salle.fermee_pour] : "accueil.fermee", { n: salle.numero })} ${mots("accueil.rouvrir")}`
        : mots("accueil.cetteSalle");
      ain("arret");
    }
    retourDe = null;
    ecrire($("retour-mot"), phrase);
    $("retour").hidden = false;
  }
  $("retour-fermer").addEventListener("click", () => { $("retour").hidden = true; });

  // APPUIE SUR START: Entrée hors d'un champ, ou le Start d'une manette,
  // ouvrent une salle, seulement à zéro salle et seulement quand l'effet
  // « start » est allumé (niveaux conseillé et tout). `surStart` vient du socle.
  try {
    arcade?.surStart(() => {
      if (rates < 2 && derniereListe.length > 0 && derniereListe.every((s) => etatDe(s) === "fermee"))
        ouvrirSalle(null);
    });
    arcade?.poserFiltreBombe();
  } catch {}

  relire();
  setInterval(relire, 5000);
</script>
</body>
</html>
