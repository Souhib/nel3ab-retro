[package]
name = "nel3ab-emulator"
description = "Dolphin process lifecycle and named-pipe input injection."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
nel3ab-protocol = { path = "../protocol" }

# `mkfifo`, `O_NONBLOCK` and `SIGTERM` have no safe equivalent in std, and this
# workspace forbids `unsafe`. `nix` is the safe wrapper; the features are pinned
# to the two we use so the dependency stays small and an unrelated CVE in, say,
# its socket code is not our problem.
nix = { version = "0.30", default-features = false, features = ["fs", "signal"] }

# Une jaquette de disque doit arriver au navigateur sous une forme qu'il sait
# lire. Encoder un PNG à la main tiendrait en quatre-vingts lignes, mais une
# erreur d'octet s'y voit dans un navigateur et pas dans un autre, et ce n'est
# pas un endroit où gagner une dépendance vaut le risque. Licence MIT/Apache,
# comme le reste de l'arbre.
png = "0.18"

[dev-dependencies]
proptest = "1"
rstest.workspace = true
tempfile = "3"

[features]
# The integration test drives a REAL Dolphin against a REAL ROM on a machine
# with a GPU. It is off by default so `cargo test` stays honest on a laptop and
# in CI, where passing it would mean nothing.
dolphin-integration = []

[lints]
workspace = true
