<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nel3ab — les salles</title>
<style>
  /* ─────────────────────────────────────────────────────────────────────
     RÉGIE. nel3ab n'est pas un site avec des cartes, c'est une chaîne
     privée à trois canaux, et cette page est sa régie: ce qui est à
     l'antenne, ce qui est éteint, et qui se trouve dans le studio.

     Références réelles, pas un style tiré d'un catalogue: l'habillage
     d'antenne de Canal+ par Étienne Robial (1984, tenu jusqu'en 2009),
     les idents de Channel 4 par Martin Lambie-Nairn (1982), et la mire
     Test Card F de George Hersee pour la BBC (2 juillet 1967), dont les
     barres de couleur EBU donnent ici l'identité des trois canaux.

     Ce que cette page N'EST PAS, volontairement: une grille de cartes
     arrondies à ombre diffuse sur un dégradé violet. C'était la version
     précédente, produite par un générateur de systèmes de design, et
     elle aurait pu habiller n'importe quel tableau de bord.
     ───────────────────────────────────────────────────────────────── */
  /*__POLICES__*/

  :root {
    /* Graphite neutre de matériel de studio. Ni bleu nuit, ni noir pur. */
    --fond: #15171b;
    --plaque: #1e2126;
    --creux: #101216;
    --craie: #eef0f2;
    --legende: #9aa2ab;
    /* Mesuré: #3a4048 ne tenait que 1,54:1 sur la plaque, très en dessous
       des 3:1 exigés d'un élément non textuel. Ce n'est pas un détail: ce
       trait dessine les segments VIDES de la jauge, et un segment vide
       invisible fait disparaître l'échelle. On verrait un remplissage sans
       savoir « sur combien ». Celui-ci tient 3,32:1 sur la plaque. */
    --trait: #6b727b;
    /* Les trois canaux prennent trois barres EBU. Une salle garde SA
       couleur: le canal 2 est cyan même quand il est le seul allumé. */
    --canal-1: #f2e14b;
    --canal-2: #57d3f0;
    --canal-3: #63d488;
    --alerte: #ff8f6b;
    --titre: "Anybody", "Helvetica Neue", Arial, sans-serif;
    --machine: "Departure", ui-monospace, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--fond); color: var(--craie);
    font: 400 18px/1.5 var(--titre);
    padding: clamp(1rem, 2.5vh, 2rem) clamp(1rem, 3vw, 3rem);
  }
  .page { width: 100%; max-width: 1400px; margin-inline: auto; flex: 1;
          display: flex; flex-direction: column; gap: clamp(1rem, 2vh, 1.6rem); }

  /* ── Le rail de continuité, en haut ─────────────────────────────── */
  .rail {
    display: flex; align-items: baseline; gap: 1.5rem; flex-wrap: wrap;
    border-bottom: 2px solid var(--trait); padding-bottom: .7rem;
  }
  .marque { font-family: var(--machine); font-size: clamp(15px, 1.5vw, 19px);
            letter-spacing: .34em; text-transform: uppercase; }
  .rail-fait { font-family: var(--machine); font-size: clamp(13px, 1.2vw, 16px);
               color: var(--legende); letter-spacing: .12em; }
  /* L'horloge est une PREUVE DE VIE, pas une décoration: elle avance tant
     que le salon répond, elle se fige et grise quand il se tait. Une
     valeur plutôt qu'une animation, donc elle survit à
     prefers-reduced-motion, qui ne doit jamais retirer une information. */
  #horloge { font-family: var(--machine); font-variant-numeric: tabular-nums;
             margin-left: auto; font-size: clamp(15px, 1.6vw, 21px); letter-spacing: .08em; }
  #horloge[data-perdue="oui"] { color: var(--legende); }

  /* ── Les canaux ─────────────────────────────────────────────────── */
  .salles { display: flex; flex-direction: column; gap: .6rem; flex: 1; }

  /* Les trois canaux se PARTAGENT la hauteur. Une seule bande fine en haut
     d'un écran de télévision laissait un demi-mètre de vide mort en dessous,
     ce qui était le défaut principal de la page précédente. */
  /* Le canal À L'ANTENNE domine: une régie donne le grand écran au direct,
     et les canaux éteints n'ont presque rien à dire. */
  a.salle { flex: 2.2; min-height: clamp(120px, 18vh, 260px); }
  .eteint { flex: 1; min-height: clamp(72px, 9vh, 130px); }
  a.salle {
    --canal: var(--canal-1);
    position: relative; display: grid; align-items: center;
    grid-template-columns: clamp(76px, 9vw, 136px) 1fr auto;
    gap: clamp(1rem, 2.5vw, 2.4rem);
    padding: clamp(.9rem, 1.8vh, 1.5rem) clamp(1rem, 2vw, 1.8rem);
    background: var(--plaque); color: inherit; text-decoration: none;
    border: 0; border-left: 6px solid var(--canal);
    animation: entre .32s steps(4, end) both;
    animation-delay: calc(var(--rang, 0) * 70ms);
  }
  a.salle[data-canal="2"] { --canal: var(--canal-2); }
  a.salle[data-canal="3"] { --canal: var(--canal-3); }
  /* Pas de soulèvement ni d'ombre portée: sur un pupitre de régie, le
     canal sélectionné s'ÉCLAIRE, il ne décolle pas de la table. */
  a.salle:hover, a.salle:focus-visible { background: #262a30; }
  a.salle:focus-visible { outline: 3px solid var(--craie); outline-offset: -3px; }
  @keyframes entre { from { opacity: 0; } }

  /* Un canal ÉTEINT reste à sa place: la machine a trois emplacements, et
     les cacher laissait croire qu'elle n'en a qu'un. Ce n'est pas un lien:
     il n'y a rien à rejoindre, et le pilote compte les salles ouvertes. */
  .eteint {
    display: grid; align-items: center;
    grid-template-columns: clamp(76px, 9vw, 136px) 1fr;
    gap: clamp(1rem, 2.5vw, 2.4rem);
    padding: clamp(.9rem, 1.8vh, 1.5rem) clamp(1rem, 2vw, 1.8rem);
    border-left: 6px solid var(--trait);
    background: var(--creux); color: var(--legende);
  }
  .eteint .canal-chiffre { color: var(--trait); }
  .eteint-mot { font-family: var(--machine); font-size: clamp(13px, 1.3vw, 17px);
                letter-spacing: .18em; }

  .numero { display: flex; flex-direction: column; gap: .25rem; }
  /* En bas de casse et SANS text-transform: `innerText` rend la casse
     affichée, et le pilote du salon cherche « salle N » tel quel. En
     Anybody et non en Departure, dont le sous-ensemble n'a que les
     capitales et les chiffres. */
  .canal-mot { font-family: var(--titre); font-weight: 400;
               font-size: clamp(12px, 1.1vw, 15px); letter-spacing: .16em;
               color: var(--legende); white-space: nowrap; }
  .canal-chiffre { font-family: var(--titre); font-weight: 700;
                   font-size: clamp(40px, 6.4vw, 96px); line-height: .82;
                   color: var(--canal); font-variant-numeric: tabular-nums; }
  .corps { min-width: 0; }
  /* RÈGLE TENUE COMME UNE CONTRAINTE: le nom du jeu est la plus grosse
     ligne de TEXTE de la page. C'est la seule chose qu'on vient lire. */
  .jeu { font-family: var(--titre); font-weight: 700;
         font-size: clamp(24px, 3.2vw, 44px); line-height: 1.08;
         letter-spacing: -.01em; overflow-wrap: anywhere; }
  /* Sans jeu, « sur son menu » cesse d'être la plus grosse ligne de la
     page: la règle veut que le JEU domine, pas son absence. */
  .jeu[data-menu="oui"] { color: var(--legende); font-weight: 400;
                          font-size: clamp(18px, 1.9vw, 26px); }
  .gens { font-size: clamp(15px, 1.5vw, 20px); color: var(--craie); margin-top: .25em; }
  .gens[data-vide="oui"] { color: var(--legende); }

  /* La jauge: un segment par personne présente, quatre segments.
     Elle dit COMBIEN de personnes sont là, jamais qui tient quelle
     manette: la liste du salon ne porte pas les places. */
  /* Des segments PLEINS, jamais des cadres vides: quatre rectangles ajourés
     alignés à côté d'un texte en chasse fixe se lisaient comme du « tofu »,
     le carré qu'un navigateur dessine quand un glyphe manque. Une jauge qui
     a l'air d'un bug est pire qu'une jauge absente. */
  /* Une PISTE encadrée, et non quatre cases flottantes. Deux contraintes
     s'opposaient: le segment vide doit se voir sur la plaque (échelle), et
     le segment plein doit se détacher du vide (lecture). Un gris unique ne
     peut pas les tenir toutes les deux face à des couleurs vives: mesuré,
     le vert ne tenait que 2,81:1 contre un vide assez clair. Le cadre porte
     donc l'échelle, et les segments vides redeviennent sombres. */
  .jauge { display: flex; gap: 3px; justify-content: flex-end;
           border: 2px solid var(--trait); padding: 3px; }
  /* Le segment VIDE doit se voir: mesuré, #2b313a ne tenait que 1,23:1 sur
     la plaque, donc l'échelle disparaissait et la jauge ne disait plus « sur
     combien ». Celui-ci tient 3,08:1, seuil du non textuel, sans redevenir
     un cadre ajouré. */
  .jauge span { width: clamp(13px, 1.5vw, 20px); height: clamp(26px, 4vh, 50px);
                background: #2b313a; }
  .jauge span[data-plein="oui"] { background: var(--canal); }
  .jauge-mot { font-family: var(--machine); font-size: 12px; letter-spacing: .1em;
               color: var(--legende); margin-top: .35rem; text-align: right; }
  .marque-switch { font-family: var(--machine); font-size: 12px; letter-spacing: .12em;
                   color: var(--fond); background: var(--canal); padding: 2px 7px; }

  /* ── Hors antenne: la mire prend toute la page ──────────────────── */
  .vide { flex: 1; display: grid; place-items: center; position: relative;
          border: 2px solid var(--trait); min-height: 40vh; overflow: hidden; }
  /* Barres EBU, dessinées en dégradé à arrêts nets: aucune image. */
  .vide::before {
    /* Une mire tire sa force de sa SATURATION. À 22 pour cent elle rendait
       un olive et un mauve délavés, c'est-à-dire le réflexe timide qui
       produit du générique. */
    content: ""; position: absolute; inset: 0; opacity: .62;
    background: linear-gradient(90deg,
      #eef0f2 0 14.28%, #f2e14b 14.28% 28.56%, #57d3f0 28.56% 42.84%,
      #63d488 42.84% 57.12%, #d06fd0 57.12% 71.4%, #e0604f 71.4% 85.68%,
      #4f63e0 85.68% 100%);
  }
  /* OPAQUE. À 86 pour cent, les barres transparaissaient derrière les
     lettres et le contraste changeait d'un mot à l'autre, alors que la
     mesure supposait un fond uni. Une couleur qu'on ne peut pas mesurer
     n'est pas une couleur accessible. */
  .vide-bloc { position: relative; text-align: center;
               padding: clamp(1.5rem, 4vh, 2.6rem) clamp(1.5rem, 4vw, 3rem);
               background: var(--fond); border: 2px solid var(--trait); }
  .vide-titre { font-family: var(--machine); font-size: clamp(22px, 3.4vw, 46px);
                letter-spacing: .22em; margin: 0 0 .5rem; }
  .vide-mot { margin: 0 auto; max-width: 48ch; color: var(--legende);
              font-size: clamp(15px, 1.6vw, 20px); }

  /* ── Le pupitre, en bas ─────────────────────────────────────────── */
  .ouvrir { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
            border-top: 2px solid var(--trait); padding-top: 1rem; }
  button#ouvrir {
    font: 700 clamp(16px, 1.7vw, 21px) var(--titre); letter-spacing: .02em;
    min-height: 56px; padding: .7rem 1.8rem;
    border: 2px solid var(--craie); border-radius: 0;
    background: var(--craie); color: var(--fond); cursor: pointer;
  }
  button#ouvrir:hover:not(:disabled) { background: var(--canal-1); border-color: var(--canal-1); }
  button#ouvrir:disabled { cursor: not-allowed; background: transparent;
                           color: var(--legende); border-color: var(--trait); }
  .mot, .perdu { font-size: clamp(14px, 1.4vw, 18px); color: var(--legende); }
  .mot[data-refus="oui"], .perdu { color: var(--alerte); }
  .perdu[hidden] { display: none; }

  .retour[hidden] { display: none; }
  .retour { display: block; width: 100%; margin: 0 0 .4rem; padding: 1rem 1.2rem;
            border: 0; border-left: 6px solid var(--alerte); background: var(--creux);
            color: var(--craie); font: inherit; font-size: clamp(15px, 1.5vw, 19px);
            text-align: left; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--craie); outline-offset: 3px; }

  @media (max-width: 620px) {
    a.salle { grid-template-columns: clamp(56px, 14vw, 76px) 1fr; }
    .jauge { grid-column: 1 / -1; flex-direction: row; }
    .jauge span { width: 100%; height: 10px; }
    .jauge-mot { text-align: left; }
  }
  /* Une animation n'est jamais nécessaire à la compréhension de cette
     page. L'horloge, elle, reste: c'est une valeur, pas un mouvement. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <button type="button" id="retour" class="retour" hidden></button>

  <main class="page">
    <div class="rail">
      <span class="marque">nel3ab</span>
      <span class="rail-fait" id="antenne"></span>
      <span class="rail-fait" id="horloge">--:--:--</span>
    </div>

    <div class="salles" id="salles" aria-live="polite"></div>

    <div class="ouvrir">
      <button id="ouvrir" type="button">ouvrir une salle</button>
      <span class="mot" id="mot"></span>
      <span class="perdu" id="perdu" hidden>la liste ne se met plus à jour</span>
    </div>
  </main>

<script>
  // Pourquoi on se retrouve ici. Le proxy renvoie au salon quand une salle
  // n'existe plus, plutôt que d'afficher « 502 Bad Gateway », qui se lit comme
  // une panne alors que la salle s'est fermée exactement comme prévu.
  const retour = document.getElementById("retour");
  if (new URLSearchParams(location.search).get("salle") === "fermee") {
    retour.textContent =
      "Cette salle s'est fermée faute d'activité, et le jeu avec elle. "
      + "Tu peux en rouvrir une : les sauvegardes sont intactes.";
    retour.hidden = false;
    // L'adresse est nettoyée tout de suite: recharger la page ne doit pas
    // reproduire une nouvelle qui date d'il y a dix minutes.
    history.replaceState(null, "", location.pathname);
  }
  retour.addEventListener("click", () => { retour.hidden = true; });

  const liste = document.getElementById("salles");
  const mot = document.getElementById("mot");
  const bouton = document.getElementById("ouvrir");
  const perdu = document.getElementById("perdu");

  function dessiner(salles) {
    // Seules les salles OUVERTES sont montrées. Trois cases dont deux vides
    // donnaient à croire que la machine tient trois salles en permanence; il
    // n'en tourne aucune tant que personne n'en ouvre une, et c'est le but.
    const ouvertes = salles.filter(salle => salle.ouverte);
    const libres = salles.length - ouvertes.length;

    // Le style centre tout quand il n'y a rien à rejoindre. Un attribut plutôt
    // qu'une classe: il dit un ÉTAT de la page, pas une décoration.
    document.body.dataset.vide = ouvertes.length === 0 ? "oui" : "non";
    if (ouvertes.length === 0) {
      // Un écran vide se lit comme une panne. Celui-ci dit ce qui se passe et
      // ce qu'on peut faire, ce qui est la seule chose qui manque ici.
      if (!liste.querySelector(".vide")) liste.replaceChildren(vide());
    } else {
      // Les cartes sont MISES À JOUR, pas refaites.
      //
      // `replaceChildren` toutes les cinq secondes remplaçait chaque carte par
      // un noeud neuf: l'animation d'apparition repartait à zéro, le survol
      // sautait, et le focus du clavier retombait sur le corps de la page au
      // milieu d'une navigation. Rien de tout ça ne se voit en développement,
      // où la liste ne change jamais pendant qu'on la regarde.
      liste.querySelector(".vide")?.remove();
      // Les noeuds sont MIS À JOUR, pas refaits: refaire relance l'animation
      // et fait tomber le focus du clavier au milieu d'une navigation.
      const vieilles = new Map(
        [...liste.children].map(noeud => [noeud.dataset.salle, noeud]),
      );
      let precedent = null;
      salles.forEach((salle, rang) => {
        const cle = String(salle.numero);
        let noeud = vieilles.get(cle);
        // Un emplacement change de NATURE quand il s'ouvre ou se ferme: on ne
        // transforme pas un lien en bloc éteint, on remplace le noeud.
        const bonType = noeud
          && (salle.ouverte ? noeud.tagName === "A" : noeud.tagName !== "A");
        if (noeud && bonType) {
          (salle.ouverte ? remplir : remplirEteint)(noeud, salle);
          vieilles.delete(cle);
        } else {
          if (noeud) { noeud.remove(); vieilles.delete(cle); }
          noeud = salle.ouverte ? carte(salle) : eteint(salle);
          noeud.style.setProperty("--rang", String(rang));
        }
        const attendu = precedent === null ? liste.firstChild : precedent.nextSibling;
        if (attendu !== noeud) liste.insertBefore(noeud, attendu);
        precedent = noeud;
      });
      for (const partie of vieilles.values()) partie.remove();
    }

    document.getElementById("antenne").textContent =
      `${ouvertes.length} / ${salles.length} CANAUX EN ANTENNE`;

    bouton.disabled = libres === 0;
    bouton.textContent = ouvertes.length === 0 ? "ouvrir la première salle" : "ouvrir une salle";
    if (!mot.dataset.refus) {
      const reste = libres === 0
        ? `les ${salles.length} salles sont ouvertes, rejoins-en une`
        : libres === salles.length
          ? "aucune salle n'est ouverte, donc rien ne tourne"
          : `${libres} salle${libres > 1 ? "s" : ""} encore disponible${libres > 1 ? "s" : ""}`;
      // Les deux faits comptent, et l'un n'annule pas l'autre: savoir que la
      // Switch est prise ne dit pas s'il reste une salle à ouvrir. Le message
      // sur la Switch effaçait le nombre de places libres au moment précis où
      // ce nombre décide si on peut ouvrir la sienne.
      mot.textContent = salles.some(salle => salle.switch)
        ? `${reste} · la Switch est prise`
        : reste;
    }
  }

  function vide() {
    // HORS ANTENNE. L'état le plus fréquent du service devient sa plus belle
    // image, et non une excuse: la machine est allumée, elle n'émet rien.
    const bloc = document.createElement("div");
    bloc.className = "vide";
    const dedans = document.createElement("div");
    dedans.className = "vide-bloc";
    const titre = document.createElement("p");
    titre.className = "vide-titre";
    titre.textContent = "HORS ANTENNE";
    const dit = document.createElement("p");
    dit.className = "vide-mot";
    // Le pilote du salon vérifie cette phrase: « Aucune salle ouverte ».
    dit.textContent =
      "Aucune salle ouverte. Rien ne tourne sur le serveur, "
      + "donc rien ne consomme. Ouvre un canal et choisis ton jeu.";
    dedans.append(titre, dit);
    bloc.append(dedans);
    return bloc;
  }

  function eteint(salle) {
    const bloc = document.createElement("div");
    bloc.className = "eteint";
    bloc.dataset.salle = String(salle.numero);
    const numero = document.createElement("div");
    numero.className = "numero";
    const mot = document.createElement("span");
    mot.className = "canal-mot";
    const chiffre = document.createElement("span");
    chiffre.className = "canal-chiffre";
    numero.append(mot, chiffre);
    const dit = document.createElement("div");
    dit.className = "eteint-mot";
    bloc.append(numero, dit);
    remplirEteint(bloc, salle);
    return bloc;
  }

  function remplirEteint(noeud, salle) {
    noeud.querySelector(".canal-mot").textContent = `salle ${salle.numero}`;
    noeud.querySelector(".canal-chiffre").textContent = String(salle.numero);
    noeud.querySelector(".eteint-mot").textContent = "HORS SERVICE";
  }

  function carte(salle) {
    const carte = document.createElement("a");
    carte.className = "salle";
    carte.dataset.salle = String(salle.numero);
    carte.dataset.canal = String(salle.numero);

    const numero = document.createElement("div");
    numero.className = "numero";
    const canalMot = document.createElement("span");
    canalMot.className = "canal-mot";
    const canalChiffre = document.createElement("span");
    canalChiffre.className = "canal-chiffre";
    numero.append(canalMot, canalChiffre);

    const corps = document.createElement("div");
    corps.className = "corps";
    const jeu = document.createElement("div");
    jeu.className = "jeu";
    const gens = document.createElement("div");
    gens.className = "gens";
    corps.append(jeu, gens);

    const droite = document.createElement("div");
    const jauge = document.createElement("div");
    jauge.className = "jauge";
    for (let i = 0; i < 4; i += 1) jauge.append(document.createElement("span"));
    const mot = document.createElement("div");
    mot.className = "jauge-mot";
    droite.append(jauge, mot);

    carte.append(numero, corps, droite);
    remplir(carte, salle);
    return carte;
  }

  /** Ce qui CHANGE dans une carte, sans refaire la carte. */
  function remplir(noeud, salle) {
    noeud.href = salle.chemin;
    // Le pilote lit « salle N » dans le texte de la carte: le chiffre seul
    // ne suffirait pas, et un lecteur d'écran ne dirait qu'un nombre.
    noeud.setAttribute("aria-label", `salle ${salle.numero}`);
    // « salle N » en toutes lettres, et visible: un chiffre nu ne dit pas
    // « 1 de quoi ». Le pilote du salon le lit dans le texte de la carte.
    noeud.querySelector(".canal-mot").textContent = `salle ${salle.numero}`;
    noeud.querySelector(".canal-chiffre").textContent = String(salle.numero);

    // Le jeu en toutes lettres, et c'est la plus grosse ligne de la page:
    // c'est la seule chose qu'on vient lire de loin.
    const jeu = noeud.querySelector(".jeu");
    jeu.textContent = salle.jeu ?? "sur son menu";
    jeu.dataset.menu = salle.jeu ? "non" : "oui";

    const gens = salle.gens ?? [];
    const ligne = noeud.querySelector(".gens");
    ligne.textContent = gens.length === 0 ? "personne pour l'instant" : gens.join(" · ");
    ligne.dataset.vide = gens.length === 0 ? "oui" : "non";

    // La jauge dit COMBIEN de personnes sont là. Surtout pas qui tient
    // quelle manette: `/api/salles` rend une liste de pseudos sans numéro
    // de place, et prétendre le contraire serait un mensonge d'interface.
    const cases = noeud.querySelectorAll(".jauge span");
    cases.forEach((c, i) => { c.dataset.plein = i < gens.length ? "oui" : "non"; });
    const mot = noeud.querySelector(".jauge-mot");
    // Elle se NOMME, sinon quatre traits ne disent rien. Et elle compte des
    // personnes, pas des manettes: le salon ne sait pas qui tient quoi.
    const bouts = [gens.length === 0 ? "PERSONNE"
      : `${gens.length} PRESENT${gens.length > 1 ? "S" : ""}`];
    if (salle.switch) bouts.push("SWITCH");
    mot.textContent = bouts.join(" · ");
  }

  /** Combien de tours de suite le salon n'a rien rendu. */
  let ratés = 0;
  const horloge = document.getElementById("horloge");

  /** L'heure du DERNIER relevé réussi, pas l'heure qu'il est.
   *
   * C'est ce qui en fait une preuve de vie: elle avance tant que le salon
   * répond, elle se fige dès qu'il se tait. Une valeur, pas une animation,
   * donc elle dit encore quelque chose sous prefers-reduced-motion. */
  function marquer(perdue) {
    if (!perdue) {
      const d = new Date();
      const deux = (n) => String(n).padStart(2, "0");
      horloge.textContent = `${deux(d.getHours())}:${deux(d.getMinutes())}:${deux(d.getSeconds())}`;
    }
    horloge.dataset.perdue = perdue ? "oui" : "non";
  }

  async function relire() {
    try {
      const reponse = await fetch("/api/salles", { cache: "no-store" });
      if (!reponse.ok) throw new Error(String(reponse.status));
      const salles = await reponse.json();
      ratés = 0;
      perdu.hidden = true;
      marquer(false);
      // Un refus PRÉCÉDENT ne doit pas figer la ligne d'état pour toujours.
      delete mot.dataset.refus;
      dessiner(salles);
    } catch {
      // Une liste qui ne se met plus à jour a EXACTEMENT l'air d'une liste
      // fraîche: au bout de deux tours, l'horloge grise et la page le dit.
      ratés += 1;
      if (ratés >= 2) { perdu.hidden = false; marquer(true); }
    }
  }

  bouton.addEventListener("click", async () => {
    bouton.disabled = true;
    mot.dataset.refus = "";
    mot.textContent = "on ouvre la salle…";
    try {
      const reponse = await fetch("/api/salles", { method: "POST" });
      const dit = await reponse.json();
      if (reponse.ok) { location.href = dit.chemin; return; }
      mot.dataset.refus = "oui";
      mot.textContent = dit.detail ?? "la salle n'a pas voulu s'ouvrir";
    } catch {
      mot.dataset.refus = "oui";
      mot.textContent = "le salon ne répond pas";
    }
    bouton.disabled = false;
    relire();
  });

  relire();
  setInterval(relire, 5000);
</script>
</body>
</html>
