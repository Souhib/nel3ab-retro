<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nel3ab — les salles</title>
<style>
  /* Direction visuelle tirée de la base UI/UX (12 septembre 2026): violet néon
     sur fond profond, action rose, cartes en relief, apparition en cascade.
     Le style proposé s'appuyait sur de la 3D temps réel; elle est écartée ici,
     sa fiche annonçant elle-même un coût élevé et un risque d'accessibilité,
     pour une page qui doit s'afficher en une seconde sur un téléviseur. La
     profondeur est donc obtenue par des ombres en couches et une lueur, sans
     moteur 3D ni image lourde.

     Les polices restent celles du système: dépendre d'un service tiers pour
     afficher la page d'accueil d'une machine privée serait une panne de plus à
     la merci du réseau. */
  :root {
    --fond: #0f0f23;
    --fond-haut: #16163a;
    --carte: #1e1c35;
    --carte-haute: #272348;
    --trait: #4c1d95;
    --texte: #e2e8f0;
    --doux: #94a3b8;
    --vif: #7c3aed;
    --vif-clair: #a78bfa;
    /* Mesuré le 12 septembre 2026: le rose précédent (#f43f5e) donnait
       3,67:1 avec du texte blanc, sous le seuil AA de 4,5:1, sur la SEULE
       action de la page. Celui-ci donne 4,70:1, et le bas du dégradé
       (#9f1239) 8,02:1: tout le bouton passe, pas seulement un bord. */
    --action: #e11d48;
    --ouverte: #4ade80;
    --titre: ui-sans-serif, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: clamp(2rem, 5vh, 4rem) clamp(1.2rem, 6vw, 5rem);
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(120% 80% at 15% -10%, rgba(124, 58, 237, .28), transparent 60%),
      radial-gradient(90% 60% at 100% 0%, rgba(244, 63, 94, .14), transparent 55%),
      var(--fond);
    color: var(--texte);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Une colonne, centrée. Sur un téléviseur large, un contenu collé au bord
     gauche laisse l'œil traverser un mètre de vide pour rien. */
  .page {
    width: 100%;
    max-width: 1080px;
    margin-inline: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  /* Aucune salle ouverte: tout se centre dans la hauteur. Un message d'attente
     collé en haut d'un écran vide se lit comme un reste de page; au milieu, il
     EST la page. */
  body[data-vide="oui"] .page { justify-content: center; }
  body[data-vide="oui"] .salles,
  body[data-vide="oui"] .ouvrir { justify-content: center; }
  body[data-vide="oui"] header { text-align: center; }
  body[data-vide="oui"] .vide-mot { margin-inline: auto; }

  h1 {
    font-family: var(--titre);
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -.03em;
    margin: 0 0 .15em;
    background: linear-gradient(100deg, var(--texte) 25%, var(--vif-clair));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sous { color: var(--doux); font-size: clamp(1.05rem, 2vw, 1.35rem); margin: 0 0 2.5em; }

  .salles {
    display: grid;
    gap: 1.4rem;
    /* `min(290px, 100%)`: sous ~330 px de large, un plancher de 290 px plus les
     marges du corps poussait la grille plus loin que l'écran. */
    grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 360px));
    justify-content: start;
  }
  /* L'écran vide, lui, occupe toute la largeur disponible: il n'est pas une
     carte, et le border-dashed d'une seule colonne se lirait comme une salle
     fantôme. */
  .salles:has(.vide) { grid-template-columns: minmax(0, 720px); }

  /* La carte ENTIÈRE est le lien: viser une petite étiquette à deux mètres d'un
     téléviseur est une cible qu'on rate. */
  a.salle {
    position: relative;
    display: flex; flex-direction: column; gap: .55rem;
    min-height: 190px;
    padding: 1.6rem;
    border: 1px solid var(--trait);
    border-radius: 18px;
    background: linear-gradient(165deg, var(--carte-haute), var(--carte));
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 18px 40px -24px rgba(0,0,0,.9);
    color: inherit; text-decoration: none;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    animation: monte .38s cubic-bezier(.2,.8,.3,1.2) both;
    animation-delay: calc(var(--rang, 0) * 60ms);
  }
  a.salle:hover, a.salle:focus-visible {
    transform: translateY(-3px);
    border-color: var(--vif-clair);
    box-shadow: 0 1px 0 rgba(255,255,255,.10) inset, 0 26px 50px -26px rgba(124,58,237,.85);
  }
  @keyframes monte { from { opacity: 0; transform: translateY(14px) scale(.97); } }

  .titre {
    font-family: var(--titre);
    font-size: clamp(1.45rem, 2.6vw, 2rem);
    font-weight: 700;
    letter-spacing: -.01em;
  }
  /* Le jeu en toutes lettres: une pastille de couleur ne se lit ni de loin, ni
     pour qui distingue mal les couleurs. */
  .etat { color: var(--doux); font-size: 1.08rem; }
  .etat::before {
    content: "";
    display: inline-block;
    width: .55rem; height: .55rem;
    margin-right: .55rem;
    border-radius: 50%;
    background: var(--ouverte);
    box-shadow: 0 0 10px var(--ouverte);
    vertical-align: middle;
  }
  /* Les présents, sous le jeu. Même encre que lui: c'est la même nature
     d'information, ce que la salle contient en ce moment. */
  .gens { color: var(--texte); font-size: 1.02rem; }
  .gens[data-vide="oui"] { color: var(--doux); }
  .marques { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: auto; }
  .marque {
    border: 1px solid var(--trait);
    border-radius: 999px;
    padding: .2rem .75rem;
    font-size: .95rem;
    color: var(--vif-clair);
    background: rgba(124,58,237,.12);
  }
  .rejoindre {
    align-self: flex-start;
    margin-top: .3rem;
    color: var(--vif-clair);
    font-weight: 650;
    font-size: 1.08rem;
  }
  a.salle:hover .rejoindre::after, a.salle:focus-visible .rejoindre::after { transform: translateX(4px); }
  .rejoindre::after {
    content: "→";
    display: inline-block;
    margin-left: .4rem;
    transition: transform .18s ease;
  }

  .vide {
    grid-column: 1 / -1;
    border: 1px dashed var(--trait);
    border-radius: 18px;
    padding: 3rem 1.5rem;
    text-align: center;
    background: rgba(30,28,53,.5);
  }
  .vide-titre { font-family: var(--titre); margin: 0 0 .5rem; font-size: 1.6rem; font-weight: 700; }
  .vide-mot { margin: 0 auto; max-width: 46ch; color: var(--doux); font-size: 1.08rem; }

  .ouvrir { margin-top: 2.8rem; display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 1.1rem; font-weight: 650;
    min-height: 52px; padding: .8rem 1.6rem;
    border: 0; border-radius: 12px;
    background: linear-gradient(160deg, var(--action), #9f1239);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 14px 30px -18px var(--action);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
  /* PAS `opacity: .4`: le texte tombait à 2,21:1, illisible. Des couleurs
     explicites tiennent 6,44:1 tout en disant clairement « indisponible ». */
  button:disabled {
    cursor: not-allowed; box-shadow: none;
    background: var(--carte); color: var(--doux);
    border: 1px solid var(--trait);
  }
  .mot { color: var(--doux); font-size: 1.05rem; }
  .mot[data-refus="oui"] { color: #ffb4a2; }
  .perdu { color: #ffb4a2; font-size: 1.05rem; }
  .perdu[hidden] { display: none; }

  .retour[hidden] { display: none; }
  .retour {
    display: block;
    width: 100%;
    max-width: 78ch;
    margin: 0 0 2.2rem; padding: 1.1rem 1.3rem;
    border: 1px solid var(--trait); border-radius: 14px;
    background: linear-gradient(165deg, var(--carte-haute), var(--carte));
    color: var(--texte); font: inherit; font-size: 1.05rem;
    text-align: left; cursor: pointer;
  }
  .retour:hover { border-color: var(--vif-clair); }

  :focus-visible { outline: 3px solid var(--vif-clair); outline-offset: 3px; }

  /* Une animation n'est jamais nécessaire à la compréhension de cette page. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <!-- Le retour d'une salle qui s'est fermée. Cliquable pour disparaître,
       comme le bandeau de la salle: un message qu'on ne peut pas faire taire
       finit par être contourné. -->
  <button type="button" id="retour" class="retour" hidden></button>

  <main class="page">
    <header>
      <h1>nel3ab</h1>
      <p class="sous">Choisis une salle, ou ouvre la tienne.</p>
    </header>

    <div class="salles" id="salles" aria-live="polite"></div>

    <div class="ouvrir">
      <button id="ouvrir" type="button">ouvrir une salle</button>
      <span class="mot" id="mot"></span>
      <span class="perdu" id="perdu" hidden>la liste ne se met plus à jour</span>
    </div>
  </main>

<script>
  // Pourquoi on se retrouve ici. Le proxy renvoie au salon quand une salle
  // n'existe plus, plutôt que d'afficher « 502 Bad Gateway », qui se lit comme
  // une panne alors que la salle s'est fermée exactement comme prévu.
  const retour = document.getElementById("retour");
  if (new URLSearchParams(location.search).get("salle") === "fermee") {
    retour.textContent =
      "Cette salle s'est fermée faute d'activité, et le jeu avec elle. "
      + "Tu peux en rouvrir une : les sauvegardes sont intactes.";
    retour.hidden = false;
    // L'adresse est nettoyée tout de suite: recharger la page ne doit pas
    // reproduire une nouvelle qui date d'il y a dix minutes.
    history.replaceState(null, "", location.pathname);
  }
  retour.addEventListener("click", () => { retour.hidden = true; });

  const liste = document.getElementById("salles");
  const mot = document.getElementById("mot");
  const bouton = document.getElementById("ouvrir");
  const perdu = document.getElementById("perdu");

  function dessiner(salles) {
    // Seules les salles OUVERTES sont montrées. Trois cases dont deux vides
    // donnaient à croire que la machine tient trois salles en permanence; il
    // n'en tourne aucune tant que personne n'en ouvre une, et c'est le but.
    const ouvertes = salles.filter(salle => salle.ouverte);
    const libres = salles.length - ouvertes.length;

    // Le style centre tout quand il n'y a rien à rejoindre. Un attribut plutôt
    // qu'une classe: il dit un ÉTAT de la page, pas une décoration.
    document.body.dataset.vide = ouvertes.length === 0 ? "oui" : "non";
    if (ouvertes.length === 0) {
      // Un écran vide se lit comme une panne. Celui-ci dit ce qui se passe et
      // ce qu'on peut faire, ce qui est la seule chose qui manque ici.
      if (!liste.querySelector(".vide")) liste.replaceChildren(vide());
    } else {
      // Les cartes sont MISES À JOUR, pas refaites.
      //
      // `replaceChildren` toutes les cinq secondes remplaçait chaque carte par
      // un noeud neuf: l'animation d'apparition repartait à zéro, le survol
      // sautait, et le focus du clavier retombait sur le corps de la page au
      // milieu d'une navigation. Rien de tout ça ne se voit en développement,
      // où la liste ne change jamais pendant qu'on la regarde.
      liste.querySelector(".vide")?.remove();
      const vieilles = new Map(
        [...liste.children].map(noeud => [noeud.dataset.salle, noeud]),
      );
      let precedent = null;
      ouvertes.forEach((salle, rang) => {
        const cle = String(salle.numero);
        let noeud = vieilles.get(cle);
        if (noeud) {
          remplir(noeud, salle);
          vieilles.delete(cle);
        } else {
          noeud = carte(salle);
          // La cascade: le CSS lit `--rang`, que personne ne posait, donc les
          // cartes apparaissaient toutes en même temps.
          noeud.style.setProperty("--rang", String(rang));
        }
        // Déplacé SEULEMENT si sa place a changé: bouger un noeud relance son
        // animation, et c'est précisément ce qu'on vient d'éviter.
        const attendu = precedent === null ? liste.firstChild : precedent.nextSibling;
        if (attendu !== noeud) liste.insertBefore(noeud, attendu);
        precedent = noeud;
      });
      for (const partie of vieilles.values()) partie.remove();
    }

    bouton.disabled = libres === 0;
    bouton.textContent = ouvertes.length === 0 ? "ouvrir la première salle" : "ouvrir une salle";
    if (!mot.dataset.refus) {
      const reste = libres === 0
        ? `les ${salles.length} salles sont ouvertes, rejoins-en une`
        : libres === salles.length
          ? "aucune salle n'est ouverte, donc rien ne tourne"
          : `${libres} salle${libres > 1 ? "s" : ""} encore disponible${libres > 1 ? "s" : ""}`;
      // Les deux faits comptent, et l'un n'annule pas l'autre: savoir que la
      // Switch est prise ne dit pas s'il reste une salle à ouvrir. Le message
      // sur la Switch effaçait le nombre de places libres au moment précis où
      // ce nombre décide si on peut ouvrir la sienne.
      mot.textContent = salles.some(salle => salle.switch)
        ? `${reste} · la Switch est prise`
        : reste;
    }
  }

  function vide() {
    const bloc = document.createElement("div");
    bloc.className = "vide";
    const titre = document.createElement("p");
    titre.className = "vide-titre";
    titre.textContent = "Aucune salle ouverte";
    const dit = document.createElement("p");
    dit.className = "vide-mot";
    dit.textContent =
      "Rien ne tourne sur le serveur pour l'instant. Ouvre une salle et choisis ton jeu.";
    bloc.append(titre, dit);
    return bloc;
  }

  function carte(salle) {
    const carte = document.createElement("a");
    carte.className = "salle";
    carte.dataset.salle = String(salle.numero);
    const titre = document.createElement("div");
    titre.className = "titre";
    const etat = document.createElement("div");
    etat.className = "etat";
    const gens = document.createElement("div");
    gens.className = "gens";
    const marques = document.createElement("div");
    marques.className = "marques";
    const rejoindre = document.createElement("span");
    rejoindre.className = "rejoindre";
    rejoindre.textContent = "rejoindre";
    carte.append(titre, etat, gens, marques, rejoindre);
    remplir(carte, salle);
    return carte;
  }

  /** Ce qui CHANGE dans une carte, sans refaire la carte.
   *
   * Le jeu en toutes lettres, et pas seulement une pastille de couleur: une
   * couleur seule ne se lit ni de loin ni pour qui les distingue mal. */
  function remplir(noeud, salle) {
    noeud.href = salle.chemin;
    noeud.querySelector(".titre").textContent = `salle ${salle.numero}`;
    noeud.querySelector(".etat").textContent = salle.jeu ?? "sur son menu";
    // Qui est là, en toutes lettres. Une carte qui ne le dit pas oblige à
    // entrer pour le savoir, et entrer prend une manette à quelqu'un.
    const gens = salle.gens ?? [];
    const ligne = noeud.querySelector(".gens");
    ligne.textContent = gens.length === 0 ? "personne pour l'instant" : gens.join(" · ");
    ligne.dataset.vide = gens.length === 0 ? "oui" : "non";
    const marques = noeud.querySelector(".marques");
    const veut = salle.switch ? ["Switch"] : [];
    if ([...marques.children].map(n => n.textContent).join("|") !== veut.join("|")) {
      marques.replaceChildren(...veut.map(texte => {
        const marque = document.createElement("span");
        marque.className = "marque";
        marque.textContent = texte;
        return marque;
      }));
    }
  }

  /** Combien de tours de suite le salon n'a rien rendu. */
  let ratés = 0;
  async function relire() {
    try {
      const reponse = await fetch("/api/salles", { cache: "no-store" });
      if (!reponse.ok) throw new Error(String(reponse.status));
      const salles = await reponse.json();
      ratés = 0;
      perdu.hidden = true;
      // Un refus PRÉCÉDENT ne doit pas figer la ligne d'état pour toujours: il
      // restait jusqu'au rechargement, donc la page continuait d'annoncer un
      // échec que le tour suivant avait démenti.
      delete mot.dataset.refus;
      dessiner(salles);
    } catch {
      // Le salon redémarre en deux secondes: on retente au prochain tour plutôt
      // que d'effacer la liste sous les yeux de quelqu'un. Mais une liste qui
      // ne se met plus à jour a EXACTEMENT l'air d'une liste fraîche, et c'est
      // le pire des deux: au bout de deux tours, elle le dit.
      ratés += 1;
      if (ratés >= 2) perdu.hidden = false;
    }
  }

  bouton.addEventListener("click", async () => {
    bouton.disabled = true;
    mot.dataset.refus = "";
    mot.textContent = "on ouvre la salle…";
    try {
      const reponse = await fetch("/api/salles", { method: "POST" });
      const dit = await reponse.json();
      if (reponse.ok) { location.href = dit.chemin; return; }
      mot.dataset.refus = "oui";
      mot.textContent = dit.detail ?? "la salle n'a pas voulu s'ouvrir";
    } catch {
      mot.dataset.refus = "oui";
      mot.textContent = "le salon ne répond pas";
    }
    bouton.disabled = false;
    relire();
  });

  relire();
  setInterval(relire, 5000);
</script>
</body>
</html>
