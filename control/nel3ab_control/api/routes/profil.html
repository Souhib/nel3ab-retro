<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nel3ab · ton carnet</title>
<!--RETRO:EN-TETE-->
<style>
  /* ─────────────────────────────────────────────────────────────────────
     TON CARNET (ADR D41, D44). Le tableau des dernières parties d'une borne
     d'arcade (effet « scores »), groupé par soirée; puis tes sauvegardes, et
     ton étiquette. La proposition « Scotch et feutre » du 22 novembre 2026
     sans son thème: plus d'étagère, plus de compteur à tambours, plus de
     bulle; le temps de jeu est dans la phrase du haut.

     Même régie que l'accueil et la salle (`front/src/regie.css`). Aucune
     requête ne sort de la machine: polices et dessins sont dans la page.
     ───────────────────────────────────────────────────────────────── */
  /*__POLICES__*/
  /*__REGIE__*/
  /* Les effets rétro, communs à la salle et au salon (`front/src/effets.css`). */
  /*__EFFETS__*/
  /*__SALON__*/
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--fond); color: var(--encre);
         font: 400 18px/1.5 var(--police-texte);
         padding: clamp(.75rem, 2.5vh, 2rem) clamp(1rem, 3vw, 3rem); }
  .page { width: 100%; max-width: 1100px; margin-inline: auto;
          display: flex; flex-direction: column; gap: clamp(1rem, 2.4vh, 1.8rem); }
  :focus-visible { outline: var(--focus-largeur) solid var(--focus); outline-offset: 3px; }
  [hidden] { display: none !important; }

  h1 { margin: 0; font-family: var(--police-titre); font-weight: 400; font-size: clamp(26px, 3.6vw, 44px); line-height: 1.1; }
  h2 { margin: 0 0 .6rem; font-family: var(--police-titre); font-weight: 400; font-size: clamp(18px, 1.8vw, 24px);
       text-transform: uppercase; letter-spacing: .06em; }
  .phrase { margin: .3rem 0 0; font-size: clamp(16px, 1.6vw, 20px); font-variant-numeric: tabular-nums; }
  .legende { margin: 0; color: var(--legende); font-size: clamp(14px, 1.3vw, 17px); }
  .erreur { color: var(--alerte); }
  .plein, .cadre { cursor: pointer; border-radius: var(--rayon); font-family: var(--police-titre);
                   display: inline-flex; align-items: center; text-decoration: none; }
  .plein { min-height: 52px; padding: .6rem 1.6rem; font-size: clamp(16px, 1.6vw, 20px);
           color: var(--bouton-plein-encre); background: var(--bouton-plein-fond);
           border: 2px solid var(--bouton-plein-fond); }
  .plein:hover { background: var(--bouton-plein-survol); }
  .cadre { min-height: 44px; padding: .4rem 1.1rem; font-size: clamp(14px, 1.3vw, 17px);
           color: var(--bouton-cadre-encre); background: transparent; border: 2px solid var(--bouton-cadre-trait); }
  .cadre:hover:not(:disabled) { background: var(--survol); }
  .cadre:disabled { opacity: .6; cursor: not-allowed; }

  /* ── Le tableau DERNIÈRES PARTIES (effet « scores ») ───────────────── */
  /* Une règle sous le titre: Aïn y range la soirée (scène « range »). */
  .regle { height: 2px; background: var(--trait); margin: 0 0 .4rem; }
  .table-boite { overflow-x: auto; }
  table.scores { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.scores th, table.scores td { padding: .45rem .6rem; text-align: left; vertical-align: top; }
  table.scores thead th { font-family: var(--police-titre); font-weight: 400; color: var(--legende);
                          font-size: 14px; border-bottom: 2px solid var(--trait); }
  table.scores tbody th { font-family: var(--police-titre); font-weight: 400; padding-top: 1rem;
                          color: var(--signal); border-bottom: 1px solid var(--trait); }
  table.scores td { border-bottom: 1px solid var(--filet); }
  .jeu-titre { font-weight: 700; }
  .jeu-console, .partie-avec { display: block; color: var(--legende); font-size: 14px; }
  .partie-avec { color: var(--encre); }
  .duree { font-family: var(--police-machine); letter-spacing: .06em; white-space: nowrap; }
  .duree[data-inconnue="oui"] { color: var(--legende); }
  /* La partie que cet appareil n'avait pas encore vue s'allume une fois. */
  .fx-arrive tr[data-nouvelle] td { animation: rt-allumage .6s steps(3, end) 1; }
  #plus { margin-top: .8rem; }

  /* ── Tes sauvegardes ───────────────────────────────────────────────── */
  .sauvegardes { margin: 0; padding: 0; list-style: none; display: grid; gap: .4rem; }
  .sauvegardes li { padding: .5rem .7rem; background: var(--plaque); border-left: 4px solid var(--trait); }

  /* ── Ton étiquette, et la boîte qui la change ──────────────────────── */
  .ton-nom { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; }
  .ton-nom .etiquette { font-size: 1.1rem; }
  dialog { max-width: min(32rem, calc(100vw - 2rem)); padding: 1.2rem 1.4rem; color: var(--encre);
           background: var(--plaque); border: 2px solid var(--trait); border-radius: var(--rayon); }
  dialog::backdrop { background: color-mix(in srgb, var(--noir) 60%, transparent); }
  dialog form { display: flex; flex-direction: column; gap: .8rem; }
  dialog label { font-family: var(--police-titre); }
  dialog input { min-height: 44px; font: inherit; padding: .3rem .6rem; color: var(--encre);
                 background: var(--champ-fond); border: 2px solid var(--champ-trait); border-radius: var(--rayon); }
  .boutons { display: flex; flex-wrap: wrap; gap: .6rem; }
  .boutons .plein { min-height: 44px; font-size: 16px; padding: .4rem 1.2rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="rt-pointeur">
  <main class="page">
    <header class="entete">
      <!--RETRO:BANDEAU /profil-->
    </header>

    <section aria-labelledby="bonjour">
      <h1 id="bonjour">Ton carnet</h1>
      <p class="phrase" id="depuis">On ouvre ton carnet…</p>
      <p class="legende" id="aussi"></p>
      <a class="plein" id="voir-salles" href="/" hidden>Voir les salles</a>
    </section>

    <div id="avec" hidden>
      <section aria-labelledby="titre-parties">
        <h2 id="titre-parties">Dernières parties</h2>
        <div class="regle" data-ancre="regle-carnet"></div>
        <div class="table-boite">
          <table class="scores rt-scores" id="parties">
            <thead><tr><th scope="col">Quand</th><th scope="col">Jeu</th><th scope="col">Durée</th>
              <th scope="col">Lancée par</th><th scope="col">Sauvegarde</th></tr></thead>
          </table>
        </div>
        <p class="legende" id="aucune" hidden>Aucune partie notée pour l'instant.</p>
        <button class="cadre" id="plus" type="button" hidden>Voir les plus anciennes</button>
      </section>

      <section aria-labelledby="titre-sauvegardes" style="margin-top: clamp(1.4rem, 3vh, 2.4rem)">
        <h2 id="titre-sauvegardes">Tes sauvegardes</h2>
        <ul class="sauvegardes" id="sauvegardes"></ul>
      </section>

      <section aria-labelledby="titre-nom" style="margin-top: clamp(1.4rem, 3vh, 2.4rem)">
        <h2 id="titre-nom">Ton étiquette</h2>
        <div class="ton-nom">
          <span class="etiquette" id="etiquette"></span>
          <button class="cadre" id="changer-nom" type="button">Changer ton nom</button>
        </div>
      </section>
    </div>
  </main>

  <dialog id="nom" aria-labelledby="nom-titre">
    <form method="dialog" id="nom-forme">
      <h2 id="nom-titre">Changer ton nom</h2>
      <label for="nom-champ">Ton nom, tel que les autres le voient</label>
      <input id="nom-champ" name="nom" maxlength="32" autocomplete="nickname" required>
      <p class="legende">Ton étiquette : <span class="etiquette" id="nom-apercu"></span></p>
      <p class="legende erreur" id="nom-erreur" role="alert" hidden></p>
      <div class="boutons">
        <button class="plein" type="submit" value="garder">Garder ce nom</button>
        <button class="cadre" type="button" id="nom-annuler">Annuler</button>
      </div>
    </form>
  </dialog>

<!--RETRO:AIN-->
<script>
  // Tout ce que la page écrit passe par textContent: un pseudo ou un titre ne
  // devient jamais du HTML, même s'il en contient.
  const $ = (id) => document.getElementById(id);
  const ZONE = "Europe/Paris";
  const jour = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", timeZone: ZONE });
  const soiree = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: ZONE });
  const heure = new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit", timeZone: ZONE });
  const ain = (quoi) => { try { window.nel3abAin?.scene(quoi); } catch {} };

  function el(tag, classe, texte) {
    const noeud = document.createElement(tag);
    if (classe) noeud.className = classe;
    if (texte !== undefined) noeud.textContent = texte;
    return noeud;
  }
  const deux = (n) => String(n).padStart(2, "0");

  /** « 17 h 02 », « 12 min », « moins d'une minute ». */
  function duree(secondes) {
    if (secondes < 60) return "moins d'une minute";
    const minutes = Math.floor(secondes / 60);
    if (minutes < 60) return `${minutes} min`;
    return `${Math.floor(minutes / 60)} h ${deux(minutes % 60)}`;
  }
  /** La durée d'une partie en chiffres d'afficheur: 4 360 s s'écrit 01:12:40. */
  function afficheur(secondes) {
    return `${deux(Math.floor(secondes / 3600))}:${deux(Math.floor(secondes / 60) % 60)}:${deux(secondes % 60)}`;
  }
  /** « 1 partie », « 3 parties »: le pluriel est donné, pas deviné. */
  function compte(n, un, plusieurs) { return `${n} ${n > 1 ? plusieurs : un}`; }
  function octets(n) {
    const nombre = (x) => x.toLocaleString("fr-FR", { maximumFractionDigits: 1 });
    if (n < 1024) return `${n} octets`;
    if (n < 1024 * 1024) return `${nombre(n / 1024)} Ko`;
    return `${nombre(n / (1024 * 1024))} Mo`;
  }

  /** La soirée d'une partie: une partie lancée à 1 h 30 appartient à la
   * soirée de la veille. On recule de six heures avant de lire la date. */
  const SIX_HEURES = 6 * 3600 * 1000;
  function soireeDe(debut) {
    const mot = soiree.format(new Date(new Date(debut).getTime() - SIX_HEURES));
    return mot.charAt(0).toUpperCase() + mot.slice(1);
  }

  /** Le nom de la sauvegarde où la partie s'est écrite. */
  const SAUVEGARDE = {
    mienne: () => "ta sauvegarde",
    du_lanceur: (p) => `la sauvegarde de ${p.lance_par ?? "quelqu'un"}`,
    commune: () => "tout débloqué",
    neuve: () => "nouvelle partie",
    inconnue: () => "inconnue",
  };

  /** « Ben », « Ben et Clara », « Ben, Clara et Dora ». */
  const enListe = new Intl.ListFormat("fr", { type: "conjunction" });

  /** Le carnet commun (D12, 24 novembre 2026): qui jouait avec toi, à quelle
   * place, et qui regardait. Rien quand tu étais seul. */
  function avecQui(partie) {
    const avec = partie.avec ?? [];
    const regardaient = partie.regardaient ?? [];
    const phrases = [];
    if (avec.length > 0)
      phrases.push(`Tu as joué avec ${enListe.format(avec.map((un) => `${un.nom} (${un.place}P)`))}.`);
    if (regardaient.length > 0)
      phrases.push(`${enListe.format(regardaient)} ${regardaient.length > 1 ? "ont" : "a"} regardé.`);
    return phrases.length > 0 ? el("small", "partie-avec", phrases.join(" ")) : null;
  }

  function ligneDePartie(partie) {
    const tr = el("tr", "partie");
    tr.dataset.id = partie.id;
    tr.append(el("td", "quand", heure.format(new Date(partie.debut))));
    const jeu = el("td");
    jeu.append(el("span", "jeu-titre", partie.titre),
      el("span", "jeu-console", `${partie.console.label} · salle ${partie.salle}`));
    const avec = avecQui(partie);
    if (avec) jeu.append(avec);
    tr.append(jeu);
    const temps = el("td", "duree", partie.en_cours ? "en cours"
      : partie.complete ? afficheur(partie.secondes) : "--:--:--");
    temps.dataset.inconnue = partie.complete || partie.en_cours ? "non" : "oui";
    if (!partie.complete && !partie.en_cours) temps.setAttribute("aria-label", "durée inconnue");
    tr.append(temps);
    tr.append(el("td", "lance-par", partie.lance_par ?? "toi"));
    tr.append(el("td", "sauvegarde", (SAUVEGARDE[partie.sauvegarde] ?? SAUVEGARDE.inconnue)(partie)));
    return tr;
  }

  /** Range des parties dans le tableau, une tête de groupe par soirée. Une
   * page suivante continue le groupe de la dernière soirée lue. */
  function ranger(parties) {
    const table = $("parties");
    for (const partie of parties) {
      const nom = soireeDe(partie.debut);
      let groupe = table.tBodies[table.tBodies.length - 1];
      if (!groupe || groupe.dataset.soiree !== nom) {
        groupe = el("tbody");
        groupe.dataset.soiree = nom;
        const tete = el("tr");
        const th = el("th", "", nom);
        th.colSpan = 5;
        th.scope = "rowgroup";
        tete.append(th);
        groupe.append(tete);
        table.append(groupe);
      }
      groupe.append(ligneDePartie(partie));
    }
  }

  /** La scène « range »: la partie la plus récente n'a pas encore été vue sur
   * cet appareil. Une mémoire du navigateur, propre à l'appareil; refusée
   * (navigation privée), la scène ne joue pas et la page reste juste. */
  const VUE = "nel3ab:carnet-vu";
  function rangerLaSoiree(parties) {
    const recente = parties[0];
    if (!recente) return;
    let vue = null;
    try { vue = localStorage.getItem(VUE); } catch { return; }
    if (vue === recente.id) return;
    try { localStorage.setItem(VUE, recente.id); } catch { return; }
    // La toute première ouverture ne joue rien: rien n'était rangé avant.
    if (vue === null) return;
    [...document.querySelectorAll("tr.partie")].find((tr) => tr.dataset.id === recente.id)
      ?.setAttribute("data-nouvelle", "");
    ain("range");
  }

  let suivant = null;
  let premiere = true;
  async function plusDeParties() {
    const bouton = $("plus");
    bouton.disabled = true;
    try {
      const page = await lire(`/api/me/parties?limite=20${suivant ? `&avant=${suivant}` : ""}`);
      ranger(page.parties);
      if (premiere) { rangerLaSoiree(page.parties); premiere = false; }
      $("aucune").hidden = !(page.parties.length === 0 && !suivant);
      suivant = page.suivant;
      bouton.hidden = suivant === null;
      bouton.textContent = "Voir les plus anciennes";
    } catch {
      bouton.hidden = false;
      bouton.textContent = "Réessayer";
    }
    bouton.disabled = false;
  }
  $("plus").addEventListener("click", plusDeParties);

  function sauvegardes(emplacements) {
    const lieu = $("sauvegardes");
    lieu.replaceChildren();
    if (emplacements.length === 0) {
      lieu.append(el("li", "", "Aucune sauvegarde à toi pour l'instant. Lance un jeu sur « ma sauvegarde » et elle apparaîtra ici."));
      return;
    }
    for (const un of emplacements) {
      const s = un.sauvegarde;
      const ecrite = s.derniere_ecriture
        ? `écrite le ${jour.format(new Date(s.derniere_ecriture))} à ${heure.format(new Date(s.derniere_ecriture)).replace(":", " h ")}`
        : "encore vide";
      const versions = s.versions === 0 ? "Aucune version précédente gardée"
        : compte(s.versions, "version précédente gardée", "versions précédentes gardées");
      const li = el("li");
      li.append(el("strong", "", un.titre), ` · ${un.console.label}, ${ecrite}. ${versions}, ${octets(s.octets)}.`);
      lieu.append(li);
    }
  }

  class SansIdentite extends Error {}
  async function lire(adresse) {
    const reponse = await fetch(adresse, { cache: "no-store" });
    if (reponse.status === 401) throw new SansIdentite();
    if (!reponse.ok) throw new Error(String(reponse.status));
    return reponse.json();
  }

  // ── Changer ton nom: une boîte de dialogue sur la page même ───────────
  let monNom = "";
  const boite = $("nom");
  let ouvreur = null;
  function ouvrirNom(depuis) {
    ouvreur = depuis ?? null;
    $("nom-champ").value = monNom;
    $("nom-apercu").textContent = monNom;
    $("nom-erreur").hidden = true;
    if (typeof boite.showModal === "function") boite.showModal(); else boite.setAttribute("open", "");
    $("nom-champ").focus();
  }
  function fermerNom() {
    if (typeof boite.close === "function") boite.close(); else boite.removeAttribute("open");
    ouvreur?.focus();
  }
  $("changer-nom").addEventListener("click", (e) => ouvrirNom(e.currentTarget));
  // « Changer ton nom » de l'en-tête commun mène à /profil#nom; ici, la même
  // boîte s'ouvre sur place, et le focus revient au lien.
  $("changer-ton-nom").addEventListener("click", (e) => { e.preventDefault(); ouvrirNom(e.currentTarget); });
  $("nom-annuler").addEventListener("click", fermerNom);
  $("nom-champ").addEventListener("input", () => { $("nom-apercu").textContent = $("nom-champ").value.trim(); });
  $("nom-forme").addEventListener("submit", async (e) => {
    e.preventDefault();
    const nom = $("nom-champ").value.trim();
    if (nom === "") { $("nom-erreur").textContent = "Écris un nom : les autres te voient par lui."; $("nom-erreur").hidden = false; return; }
    try {
      const reponse = await fetch("/api/me", {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: nom }),
      });
      if (!reponse.ok) throw new Error(String(reponse.status));
      const moi = await reponse.json();
      monNom = moi.name || nom;
      $("etiquette").textContent = monNom;
      window.nel3abBandeau?.nom(monNom);
      fermerNom();
    } catch {
      $("nom-erreur").textContent = "Le nom n'a pas été gardé. Réessaie dans un instant.";
      $("nom-erreur").hidden = false;
    }
  });

  async function ouvrir() {
    try {
      const [profil, emplacements, moi] = await Promise.all([
        // Le nom choisi vient de /api/me; s'il manque, le pseudo du carnet.
        lire("/api/me/profil"), lire("/api/me/sauvegardes"), lire("/api/me").catch(() => null),
      ]);
      monNom = moi?.name || profil.pseudo;
      $("etiquette").textContent = monNom;
      $("depuis").textContent = profil.parties === 0
        ? `${profil.pseudo}, ton carnet est encore vide. Il commence à ta première partie dans une salle.`
        : `${profil.pseudo}, ${compte(profil.parties, "partie", "parties")} sur ${compte(profil.jeux, "jeu", "jeux")}`
          + (profil.depuis ? ` depuis le ${jour.format(new Date(profil.depuis))}` : "")
          + ` : ${duree(profil.secondes)} de jeu en tout.`;
      $("aussi").textContent = profil.inconnues > 0
        ? `${compte(profil.inconnues, "partie sans fin connue ne compte", "parties sans fin connue ne comptent")} pas dans ce temps.`
        : "";
      // Un carnet vide: « Voir les salles » est le seul bouton plein.
      $("voir-salles").hidden = profil.parties > 0;
      sauvegardes(emplacements);
      $("avec").hidden = false;
      await plusDeParties();
      if (location.hash === "#nom") ouvrirNom($("changer-nom"));
    } catch (erreur) {
      if (erreur instanceof SansIdentite) {
        $("depuis").textContent = "nel3ab ne sait pas qui tu es sur cet appareil.";
        $("aussi").textContent = "Tu peux quand même jouer : entre dans une salle, et donne ton nom à l'entrée.";
        $("voir-salles").hidden = false;
        return;
      }
      $("depuis").textContent = "Le carnet ne s'ouvre pas.";
      $("aussi").textContent = "Pas de réponse. Recharge la page dans un instant.";
      $("aussi").className = "legende erreur";
    }
  }
  ouvrir();
</script>
</body>
</html>
