<!doctype html>
<meta charset="utf-8" />
<title>nel3ab — play</title>
<style>
  :root { color-scheme: dark; font-family: ui-monospace, monospace; }
  body { margin: 0; padding: 1.5rem; background: #0d0d0f; color: #ddd; }
  #wrap { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start; }
  canvas { background: #000; border: 1px solid #333; image-rendering: pixelated; width: 800px; max-width: 100%; }
  #stats { min-width: 22rem; white-space: pre-wrap; line-height: 1.6; font-size: 0.85rem; }
  .bad { color: #ff8080; }
  .note { color: #888; }
  kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 0 0.3em; }
  button { font: inherit; color: #ddd; background: #222; border: 1px solid #444;
           border-radius: 3px; padding: 0.3em 0.8em; cursor: pointer; }
  button:hover { background: #2c2c2c; }
  #hint { color: #888; font-size: 0.85rem; }
</style>

<div id="wrap">
  <canvas id="screen" width="640" height="480"></canvas>
  <div>
    <div id="stats">connecting…</div>
    <p id="seat" class="note">en attente d'une manette…</p>
    <p><button id="claim" type="button" hidden>prendre la manette</button></p>
    <p id="pad" class="note"></p>
    <p><button id="learn" type="button">configurer la manette</button>
      <button id="skip" type="button" hidden>passer ce bouton</button></p>
    <p id="lesson" class="note"></p>
    <p><button id="copy" type="button">copier les chiffres</button>
      <span id="hint"></span></p>
    <p class="note">
      <kbd>←↑↓→</kbd> stick · <kbd>X</kbd> A · <kbd>C</kbd> B · <kbd>S</kbd> X ·
      <kbd>D</kbd> Y · <kbd>A</kbd> Z · <kbd>Q</kbd> L · <kbd>E</kbd> R ·
      <kbd>Enter</kbd> Start<br />
      A gamepad, if one is plugged in, takes over on its first button press.
    </p>
  </div>
</div>

<script type="module">
  const stats = document.getElementById("stats");
  const context = document.getElementById("screen").getContext("2d");
  const canvas = context.canvas;
  const hint = document.getElementById("hint");
  const copyButton = document.getElementById("copy");
  const seat = document.getElementById("seat");
  const claimButton = document.getElementById("claim");
  const padLine = document.getElementById("pad");
  const learnButton = document.getElementById("learn");
  const skipButton = document.getElementById("skip");
  const lessonLine = document.getElementById("lesson");
  /// Replacing the panel's content destroys any selection inside it, and the
  /// panel refreshes twice a second: highlighting a number to copy it was
  /// impossible, the selection vanished before the second click. So the display
  /// HOLDS while a selection is live in it. A counter that pauses for as long as
  /// somebody is reading it is worth more than one nobody can quote.
  const selectionInside = () => {
    const selection = getSelection();
    return (
      selection !== null &&
      !selection.isCollapsed &&
      stats.contains(selection.anchorNode) &&
      stats.contains(selection.focusNode)
    );
  };

  let latest = "connecting…";
  const show = (text, cls = "") => {
    latest = text;
    if (selectionInside()) {
      hint.textContent = "figé pendant la sélection";
      return;
    }
    hint.textContent = "";
    stats.innerHTML = cls ? `<span class="${cls}">${text}</span>` : text;
  };

  // The button copies what the panel says, so nothing has to be selected at all
  // — the reason the numbers exist is to be sent to somebody.
  copyButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(latest);
      hint.textContent = "copié";
    } catch {
      // No clipboard permission: select it instead, which is at least as good
      // as what the page offered before.
      getSelection()?.selectAllChildren(stats);
      hint.textContent = "sélectionné — ⌘C";
    }
    setTimeout(() => (hint.textContent = ""), 2000);
  });

  if (!("VideoDecoder" in window)) {
    show(
      "VideoDecoder is absent — this page is not in a secure context.\n" +
        "Reach it over https, or tunnel it to localhost.",
      "bad",
    );
    throw new Error("no WebCodecs");
  }

  // `wss` when the page came over TLS, `ws` otherwise. A page served over https
  // cannot open a `ws://` socket at all — the browser blocks it as mixed content
  // — and the same page has to work behind a Tailscale HTTPS front and on a
  // plain localhost tunnel, so the scheme is derived rather than written down.
  const socketUrl = (path) =>
    `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}${path}`;

  // ── video ───────────────────────────────────────────────────────────────
  //
  // The server prefixes each access unit with the capture instant on its own
  // monotonic clock. We never interpret that number — only subtract two of them
  // — so the two clocks never have to agree, which is what makes this an honest
  // measurement rather than a clock-skew artefact.
  let decoder = null;
  let shown = 0;
  let painted = 0;
  let repeated = 0;
  const pipeline = [];
  let firstCapture = null;
  let firstArrival = null;
  let lastArrival = null;
  /// When a frame last arrived, on our own clock — used by the watchdog, and
  /// kept separate from `lastArrival` so resetting one never disarms the other.
  let lastHeard = null;
  const gaps = [];

  // Decoded frames waiting for a refresh to show them, oldest first.
  //
  // This was a single slot at first — keep the newest, drop the rest — and that
  // is wrong in a way worth spelling out, because it looks harmless.
  //
  // A 60 fps source and a 60 Hz display that are not phase-locked put two frames
  // in one refresh interval and none in the next. With one slot the first of the
  // pair is DISCARDED and the empty interval REPEATS the previous picture: one
  // wobble in arrival costs a game frame nobody ever sees, plus a visible stall.
  // Measured over Wi-Fi: five or six of sixty frames a second lost that way,
  // which is exactly what "a bit stuttery" feels like at the controller.
  //
  // A queue turns that jitter into LATENCY instead. One frame of slack means a
  // frame arriving up to 16.7 ms late still gets its own refresh, because there
  // was a spare behind it. The slack is not free, and the page says what it
  // costs rather than hiding it.
  const queue = [];
  /// How far ahead of its due time a picture is held, in MILLISECONDS.
  ///
  /// This is the latency the schedule adds, and it used to be a whole frame,
  /// set once and never given back: the player felt it at the controller and was
  /// right to. It now starts small, grows only when the picture actually starves,
  /// and is shaved back a millisecond at a time whenever it does not — so the
  /// buffer costs what the network of the moment demands and no more.
  let slackMs = 6;
  const MIN_SLACK = 3;
  const MAX_SLACK = 60;
  let target = 1;
  const MAX_TARGET = 3;
  /// The emulator's nominal frame, used only to size the initial slack. The
  /// SCHEDULE never uses it: every picture is due at its own capture instant, so
  /// a source that is not exactly 60 Hz needs nothing said about it here.
  const SOURCE_FRAME = 16.667;
  /// Eight pictures — 130 ms — is far more than the schedule ever holds and far
  /// less than a stall worth carrying.
  const MAX_QUEUE = 8;
  // Waiting for the queue to rebuild after starving. Presenting during this is
  // what would make the buffer pointless: it would spend the slack the instant
  // it arrived, and starve again on the next late frame.
  let priming = true;
  /// What to add to a frame's capture instant to get the instant it is due on
  /// our clock. Null until a cadence exists.
  ///
  /// Presenting "as soon as a frame is there" is not a cadence: on a display
  /// whose refresh is not a multiple of the source — and even on one that is,
  /// since the two are not phase-locked — each picture then lasts three, four or
  /// five refreshes at random. That unevenness is what a player sees as "not
  /// quite smooth" on a 240 Hz screen even when no frame is missing and nothing
  /// is late. The fix is to hold each picture for the interval the EMULATOR
  /// gave it, which its capture instants state exactly, rather than for however
  /// long the next one happens to take to arrive.
  let offset = null;
  /// How many refreshes each picture lasted, and when the last one appeared.
  /// Named `holds` and not `held`, which is the set of keys being pressed: a
  /// module that declares a name twice does not run AT ALL, and the page then
  /// looks like a page that is merely waiting. That is the second time.
  /// This is the number the pacing exists to steady: on a 240 Hz screen a 60 fps
  /// source should read 4, 4, 4, 4 — never 3, 5, 4, 3.
  let holds = [];
  let waits = [];
  /// How long each picture took to reach us, on mixed clocks: the difference
  /// between the emulator's capture instant and our decode instant. The constant
  /// between the two clocks is in there and never comes out — which is fine,
  /// because only the SMALLEST of these is used, and it is the fastest the
  /// pipeline has been seen to go. The schedule is then that, plus the slack.
  ///
  /// Anchoring on the FIRST picture instead cost 51 ms of pure latency: the
  /// first picture is the key frame, the largest and the slowest of the stream,
  /// and every picture after it inherited its bad luck for ever.
  let lags = [];
  let shownAt = null;
  let starved = 0;
  let starvedRecent = 0;
  let skipped = 0;
  let ticks = 0;
  let calmWindows = 0;

  /// The display's own interval, measured from the refreshes we are given
  /// rather than assumed: 60, 120 and 240 Hz screens are all in use here, and a
  /// page that assumes one of them is wrong on the other two.
  let refreshSamples = [];
  let lastRefresh = null;
  const refreshPeriod = () => {
    if (refreshSamples.length < 8) return 16.667;
    const sorted = [...refreshSamples].sort((a, b) => a - b);
    return sorted[sorted.length >> 1];
  };

  const percentile = (values, q) => {
    if (!values.length) return 0;
    const sorted = [...values].sort((a, b) => a - b);
    return sorted[Math.floor((sorted.length - 1) * q)];
  };

  // Reconnecting, because a socket that closes once is a stream that is dead
  // for good otherwise. Observed exactly that: the connection dropped, the page
  // kept showing the last painted frame, and it looked like a freeze rather than
  // a disconnection. The server forces a key frame when somebody joins, so a
  // reconnection is a picture immediately rather than a wait for the next IDR.
  let video = null;
  let reconnects = 0;
  let connected = false;
  let stalls = 0;
  let restarts = 0;
  /// When the decoder last produced a picture, and when it was last torn down.
  /// Both `null` until they have happened, which is what arms the watchdogs
  /// below only once they can tell a failure from a start-up.
  let lastOutput = null;
  let decoderGoneSince = null;
  /// When the display last asked for a picture, and how many access units were
  /// dropped rather than fed to a decoder nobody was draining.
  let lastPaintTick = null;
  let undecoded = 0;
  /// When an access unit was last handed to the decoder. Kept apart from
  /// `lastOutput` so the watchdog below can compare the two: what makes a
  /// decoder broken is being FED and producing nothing, and a decoder we have
  /// deliberately stopped feeding is not broken at all.
  let lastFed = null;
  /// Set whenever we deliberately skip an access unit: what follows a hole is
  /// undecodable, so nothing is fed again until the next key frame.
  let awaitingKey = false;

  // How long without a frame before the connection is presumed dead.
  //
  // A reconnection that waits for `onclose` is not enough, and the reason is
  // measured: the server dropped a viewer on a broken pipe, its thread exited —
  // and the TLS proxy in front kept the browser's socket open, so the page was
  // never told. It sat on its last painted frame for good. A live socket that
  // has gone quiet looks exactly like a working one, so silence has to be the
  // signal.
  //
  // Two seconds is 120 frames: far beyond any hiccup, far below patience.
  const SILENCE_LIMIT = 2000;

  // How long a rebuilt decoder waits for a key frame before we stop believing
  // the stream will bring one. The server's GOP is one second, so three is
  // already generous; this only fires if the stream is not what we think.
  const KEY_FRAME_PATIENCE = 3000;

  // How long without a refresh before the page concludes nothing is being
  // painted. Fifteen frames — far past any hitch, far below noticing.
  //
  // MEASURED, on a real tab that had been switched away from: no refresh at all,
  // four frames painted in three minutes, and meanwhile 60 access units a second
  // still going into a decoder that drained 24. Its backlog reached 1564 chunks
  // and the stream was 23 SECONDS behind, climbing. Coming back to the tab could
  // never recover: the decoder was being fed faster than it could ever drain.
  //
  // The rule that fixes it is not about tabs. The decoder exists to feed the
  // screen; when the screen stops asking, feeding the decoder is not merely
  // wasted work, it is the thing that makes coming back impossible. Watching the
  // refresh itself rather than `document.hidden` also covers an occluded window,
  // a throttled loop, and whatever else stops a refresh for reasons of its own.
  const PAINTING_STOPPED = 250;

  // How far the decoder may fall behind before it stops being given work. Under
  // any healthy condition this sits at zero or one; ten is already a tenth of a
  // second of pictures nobody has seen. A decoder that is behind and still being
  // fed turns "late" into "never".
  const MAX_BACKLOG = 10;

  /// Throws away the decoder and everything that came out of it.
  ///
  /// A decoder that has failed stays present and refuses every later chunk, so
  /// the picture stops while the socket stays perfectly healthy — the freeze
  /// that `SILENCE_LIMIT` cannot see, because bytes are still arriving. The
  /// answer is to rebuild rather than reconnect: the socket is not the broken
  /// part, and the next key frame is at most a GOP away.
  function restartDecoder() {
    restarts += 1;
    if (decoder !== null) {
      try {
        decoder.close();
      } catch {
        // Already closed by its own error handler; nothing to do.
      }
    }
    decoder = null;
    decoderGoneSince = performance.now();
    lastOutput = null;
    // What the dead decoder produced is still a valid picture, but it is the
    // past. Keeping it would paint a second of stale game over the recovery.
    while (queue.length) queue.shift().frame.close();
    offset = null;
    pipeline.length = 0;
    priming = true;
  }

  function connectVideo() {
    video = new WebSocket(socketUrl("/video"));
    video.binaryType = "arraybuffer";
    video.onopen = () => {
      connected = true;
      lastHeard = performance.now();
    };
    video.onclose = () => {
      connected = false;
      // The decoder is bound to a stream that has ended; the next one starts
      // from its own key frame with its own configuration.
      if (decoder !== null) {
        try {
          decoder.close();
        } catch {
          // Already closed by its own error handler; nothing to do.
        }
        decoder = null;
      }
      decoderGoneSince = null;
      lastOutput = null;
      reconnects += 1;
      setTimeout(connectVideo, 500);
    };
    video.onerror = () => video?.close();
    video.onmessage = onVideoMessage;
  }

  const onVideoMessage = (event) => {
    // Liveness is BYTES arriving, not frames decoding. Putting this after the
    // "wait for a key frame" gate — which is where it was first — made the
    // socket look silent for the second or so before the first IDR, so the
    // watchdog closed it, and the reconnection did the same again: a livelock
    // that the test caught and reasoning had not.
    lastHeard = performance.now();
    const message = new Uint8Array(event.data);
    // A keep-alive: the server is there, the emulator has nothing new. It
    // exists so that a game blanking the screen for two seconds does not look
    // like a dead link and cost a reconnection.
    if (message.length === 0) return;
    const capturedMicros = Number(new DataView(message.buffer).getBigUint64(0, true));
    const unit = message.subarray(8);
    const arrived = performance.now();

    // The two clocks are anchored on the first frame and never compared again.
    // Everything after is a difference of differences, so an offset between them
    // cancels out and only the CHANGE in transit time is reported.
    if (firstCapture === null) {
      firstCapture = capturedMicros / 1000;
      firstArrival = arrived;
    }
    const transit = arrived - firstArrival - (capturedMicros / 1000 - firstCapture);

    // Nobody is painting, or the decoder cannot keep up. Either way the work
    // would never reach a screen, and doing it anyway is what makes the backlog
    // unbounded. What follows a dropped access unit cannot be decoded either, so
    // the next key frame is where this picks up.
    if (
      lastPaintTick === null ||
      performance.now() - lastPaintTick > PAINTING_STOPPED ||
      (decoder !== null && decoder.decodeQueueSize > MAX_BACKLOG)
    ) {
      awaitingKey = true;
      undecoded += 1;
      return;
    }

    const isKey = hasIdr(unit);
    if (awaitingKey) {
      if (!isKey) {
        undecoded += 1;
        return;
      }
      awaitingKey = false;
    }
    if (decoder === null) {
      if (!isKey) return; // a decoder cannot start mid-GOP
      const sps = findNal(unit, 7);
      if (!sps) return;
      const hex = (v) => v.toString(16).padStart(2, "0");
      const codec = `avc1.${hex(unit[sps + 1])}${hex(unit[sps + 2])}${hex(unit[sps + 3])}`;
      decoder = new VideoDecoder({
        output: (frame) => {
          const now = performance.now();
          lastOutput = now;
          const submitted = pipeline.shift();
          if (submitted !== undefined) {
            const total = now - submitted.at + submitted.transit;
            recent.push(total);
            if (recent.length > 240) recent.shift();
          }
          // The frame carries the instant the EMULATOR produced it, taken from
          // the access unit it came out of. That number is what paces the
          // presentation below; without it a frame can only be shown "as soon as
          // it exists", which is not a cadence at all.
          queue.push({ frame, capturedMs: submitted?.capturedMs ?? null, decodedAt: now });
          if (submitted?.capturedMs !== undefined && submitted?.capturedMs !== null) {
            lags.push(now - submitted.capturedMs);
            if (lags.length > 240) lags.shift();
          }
          // A SAFETY VALVE, not the cadence. It used to be `target + 1`, which
          // fought the schedule below and won: the queue kept exactly one
          // picture, the oldest was dropped to make room for each new one, and
          // the head was therefore always a picture whose time had not come. The
          // page presented NOTHING — 897 dropped in fourteen seconds, zero
          // painted — while every other counter looked healthy.
          //
          // The schedule is what keeps the queue short; this only stops it
          // growing without bound if the schedule ever stops running.
          while (queue.length > MAX_QUEUE) {
            queue.shift().frame.close();
            skipped += 1;
          }
          shown += 1;
        },
        error: (error) => {
          show(`decoder error: ${error}`, "bad");
          restartDecoder();
        },
      });
      decoder.configure({ codec, optimizeForLatency: true });
    }

    if (lastArrival !== null) {
      gaps.push(arrived - lastArrival);
      if (gaps.length > 600) gaps.shift();
    }
    lastArrival = arrived;

    pipeline.push({ at: arrived, transit, capturedMs: capturedMicros / 1000 });
    lastFed = performance.now();
    try {
      decoder.decode(
        new EncodedVideoChunk({
          type: isKey ? "key" : "delta",
          // The server's capture instant, not a count of what came OUT. That is
          // what it was, and it made the timestamps of the frames going IN stop
          // advancing exactly when output stalled — feeding a stalling decoder
          // duplicate timestamps, which is the one input guaranteed to make the
          // stall worse.
          timestamp: capturedMicros,
          data: unit,
        }),
      );
    } catch (error) {
      // A decoder that refuses one chunk refuses every later one for the same
      // reason, so this is a decoder to replace rather than a frame to skip.
      show(`decoder refused a frame: ${error}`, "bad");
      restartDecoder();
    }
  };

  connectVideo();

  const recent = [];

  // Paint on the display's own schedule. `painted` counts refreshes that had a
  // new picture; `repeated` counts those that had to show the previous one
  // again, which is exactly what stutter is made of.
  function paint() {
    requestAnimationFrame(paint);
    ticks += 1;
    const tickAt = performance.now();
    if (lastRefresh !== null) {
      refreshSamples.push(tickAt - lastRefresh);
      if (refreshSamples.length > 120) refreshSamples.shift();
    }
    lastRefresh = tickAt;
    lastPaintTick = tickAt;
    adjustBuffer();

    if (priming) {
      // One picture is enough to start: the slack now lives in the SCHEDULE, in
      // milliseconds, rather than in a count of frames waiting in a queue.
      if (queue.length > 0) priming = false;
      else {
        repeated += 1;
        return;
      }
    }
    if (queue.length === 0) {
      starved += 1;
      starvedRecent += 1;
      repeated += 1;
      priming = true;
      // The clock a starve interrupted has stopped meaning anything: the next
      // picture to arrive sets a new one.
      offset = null;
      return;
    }

    const now = performance.now();
    // Half a refresh of tolerance, measured from the refreshes themselves: a
    // picture due in less time than it takes to reach the next refresh is due
    // NOW, and waiting for it would show the previous one twice.
    const slack = refreshPeriod() / 2;
    // Each picture is due at ITS OWN capture instant plus a fixed offset. The
    // first version advanced a running deadline by the gap between the pictures
    // it had just SHOWN, and that gap is a lie whenever one is dropped: one drop
    // doubled the interval, which locked the cadence at half rate, which made
    // the queue grow, which dropped more. A frame's own timestamp cannot be
    // dragged along by what happened to its neighbours.
    if (queue[0].capturedMs === null) {
      offset = null;
    } else {
      // Anchored WITH the buffer in it. Anchoring on "due the instant the first
      // one was shown" gave the pipeline zero slack: every frame that then
      // arrived a millisecond late was already overdue, and the catch-up threw
      // it away — 491 pictures dropped in fourteen seconds, and a stream at 27
      // per second out of 60. The buffer's whole purpose is to be the slack the
      // schedule is written around.
      offset ??= fastestLag() + slackMs;
      if (now < queue[0].capturedMs + offset - slack) {
        repeated += 1;
        return;
      }
    }

    const next = queue.shift();
    canvas.width = next.frame.displayWidth;
    canvas.height = next.frame.displayHeight;
    context.drawImage(next.frame, 0, 0);
    next.frame.close();
    painted += 1;
    if (shownAt !== null) {
      holds.push(ticks - shownAt);
      if (holds.length > 240) holds.shift();
    }
    shownAt = ticks;
    // What the schedule cost this picture: decoded at one instant, shown at
    // another. A number to read rather than a feeling to argue about.
    waits.push(now - next.decodedAt);
    if (waits.length > 240) waits.shift();
  }

  /// Grows the buffer when the path is jittery, shrinks it when it is calm.
  ///
  /// Adaptive rather than fixed because the right depth is a property of the
  /// network, not of the program: on a loopback zero is correct and a fixed
  /// buffer would be 16.7 ms of pure loss, while over Wi-Fi one or two is what
  /// stops the judder. Slow in both directions — growing costs a visible pause
  /// to refill, shrinking costs a dropped frame, so neither should happen over
  /// a blip.
  /// The best the pipeline has managed lately — the floor the schedule is set
  /// against.
  const fastestLag = () => (lags.length === 0 ? 0 : Math.min(...lags));

  function adjustBuffer() {
    const WINDOW = 120; // two seconds at 60 Hz
    if (ticks % WINDOW !== 0) return;

    // Steer the schedule towards "as fast as this pipeline has been, plus the
    // slack", a couple of milliseconds at a time. Anchoring once and living with
    // it is what let a slow first frame cost fifty milliseconds for the rest of
    // the session; a step small enough to be invisible — a fifth of a refresh —
    // gets that back within half a minute and follows the network afterwards.
    if (offset !== null && lags.length > 30) {
      const want = fastestLag() + slackMs;
      offset += Math.max(-5, Math.min(5, want - offset));
    }

    if (starvedRecent > 1 && slackMs < MAX_SLACK) {
      // Starving twice in two seconds is the network saying the margin is too
      // thin. Growing costs latency, so it is done in one step and then earned
      // back slowly rather than the other way round.
      slackMs = Math.min(MAX_SLACK, slackMs + 8);
      // Immediately, not over the next windows: a starve is happening NOW.
      if (offset !== null) offset += 8;
      calmWindows = 0;
    } else if (starvedRecent === 0) {
      calmWindows += 1;
      // The slack itself comes down too; the steering above then follows it.
      if (slackMs > MIN_SLACK) slackMs -= Math.min(2, slackMs - MIN_SLACK);
    } else {
      calmWindows = 0;
    }
    starvedRecent = 0;
  }

  requestAnimationFrame(paint);

  // The only door in from outside. A module's scope is unreachable from the
  // page's global, and the recovery above cannot be pinned by a test that
  // cannot first BREAK the decoder — `close()` leaves it in exactly the state a
  // corrupt access unit does: present, unusable, and throwing on every decode.
  globalThis.nel3abTest = {
    // Two ways for a decoder to die, and the page has to survive both.
    // `close()` makes every later `decode()` throw — what a decoder error
    // leaves behind. Swallowing the chunks instead is the quieter one: it
    // accepts everything and produces nothing, which no error handler can see.
    wedgeDecoder: () => decoder?.close(),
    stallDecoder: () => {
      if (decoder !== null) decoder.decode = () => {};
    },
    counters: () => ({ painted, shown, stalls, restarts, undecoded, attempts }),
    readPad,
    // The lesson, drivable with a synthetic pad: what it gets wrong is a
    // SEQUENCE — a press answering two questions — and a sequence needs frames
    // fed to it one at a time.
    beginLesson: startLesson,
    feedPad: learnFrom,
    lessonAt: () => (lesson === null ? null : { step: lesson.step, waiting: lesson.waiting }),
    learnedProfile: () => padProfile,
    pacing: () => ({
      offset, queue: queue.length, slackMs, priming, fastest: fastestLag(),
      wait50: percentile(waits, 0.5), wait95: percentile(waits, 0.95),
      refresh: refreshPeriod(), holds: holds.slice(-12),
    }),
    backlog: () => decoder?.decodeQueueSize ?? 0,
  };

  /// Walks the start codes looking for a NAL of `kind`, returning where its
  /// first byte is. Written out rather than assuming a fixed offset: the
  /// parameter sets only precede the picture on IDR access units.
  function findNal(bytes, kind) {
    for (let i = 0; i + 3 < bytes.length; i++) {
      if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1) {
        if ((bytes[i + 3] & 0x1f) === kind) return i + 3;
        i += 2;
      }
    }
    return null;
  }
  const hasIdr = (bytes) => findNal(bytes, 5) !== null;

  // ── input ───────────────────────────────────────────────────────────────
  //
  // Which port this browser drives is the SERVER'S to decide — it knows who else
  // is in the room and the page does not — and it says so in one byte as soon as
  // the socket opens. Zero means the room is full. Until that byte arrives the
  // page has nothing legitimate to send, so it sends nothing.
  //
  // A page that is merely OPEN holds its port: it sends the neutral pad state on
  // every refresh whether anybody is playing or not. A tab left open on another
  // machine therefore kept the only controller of a one-player room while its
  // owner pressed keys into this page, which had none — so there is a button,
  // and only a person pressing it can displace another page. Doing it
  // automatically would have two open pages trading the pad for ever, which is
  // exactly how the same idea failed on the video socket.
  let input = null;
  let port = null;
  let refused = false;
  let attempts = 0;
  // ONE socket at a time, and the page must be able to tell which. A refused
  // page has a retry already scheduled; pressing the button started a second,
  // insisting connection alongside it — the insisting one took the port and the
  // polite one was refused half a second later, overwriting the display with
  // "no controller" while the page in fact HELD it. That is the flapping seen
  // when switching machines: the button worked every time, and the page then
  // talked itself out of it.
  let generation = 0;
  let retry = null;
  function connectInput(insist = false) {
    generation += 1;
    const mine = generation;
    if (retry !== null) {
      clearTimeout(retry);
      retry = null;
    }
    if (input !== null) {
      // Its handlers are already dead to us — `mine` no longer matches — but a
      // socket left open would go on holding a port nobody is reading.
      input.onclose = null;
      input.close();
    }
    refused = false;
    attempts += 1;
    input = new WebSocket(socketUrl(insist ? "/input?take=1" : "/input"));
    input.binaryType = "arraybuffer";
    input.onmessage = (event) => {
      if (mine !== generation) return;
      const told = new Uint8Array(event.data);
      if (told.length !== 1) return;
      port = told[0] === 0 ? null : told[0];
      refused = port === null;
      claimButton.hidden = !refused;
      seat.textContent =
        port === null
          ? "aucune manette : une autre page tient celle-ci"
          : `tu es le joueur ${port}`;
      seat.className = port === null ? "bad" : "note";
    };
    input.onclose = () => {
      if (mine !== generation) return;
      port = null;
      // Half a second after a drop, three seconds after a refusal. Asking
      // POLITELY costs nothing and takes nothing from anybody, so a page whose
      // room was full picks the controller up by itself the moment it is free —
      // which is what happens when the other page is closed. Only the button
      // ever displaces a page that is still there.
      retry = setTimeout(() => connectInput(), refused ? 3000 : 500);
    };
    input.onerror = () => {
      if (mine === generation) input?.close();
    };
  }
  claimButton.addEventListener("click", () => {
    claimButton.hidden = true;
    seat.textContent = "on prend la manette…";
    connectInput(true);
  });
  connectInput();

  const BUTTON = {
    A: 1 << 0, B: 1 << 1, X: 1 << 2, Y: 1 << 3, Z: 1 << 4,
    L: 1 << 5, R: 1 << 6, START: 1 << 7,
    D_UP: 1 << 8, D_DOWN: 1 << 9, D_LEFT: 1 << 10, D_RIGHT: 1 << 11,
  };
  const KEYS = {
    KeyX: "A", KeyC: "B", KeyS: "X", KeyD: "Y", KeyA: "Z",
    KeyQ: "L", KeyE: "R", Enter: "START",
  };
  /// A GameCube pad read out of a browser gamepad.
  ///
  /// The indices are the W3C "standard gamepad", which is what a browser reports
  /// for anything Xbox- or PlayStation-shaped. What was here before wired four
  /// of them and stopped: no D-pad, no C-stick, no analogue triggers, and `Z` on
  /// the LEFT trigger — so half the controller did nothing and the shoulder
  /// buttons were not where a GameCube player's hands expect them.
  ///
  ///   0 A · 1 B · 2 X · 3 Y        the four face buttons, in the same places
  ///   4 LB → L clicked             a bumper is a full press, not a squeeze
  ///   5 RB → Z                     where a thumb finds Z on a real pad
  ///   6 LT · 7 RT → L, R analogue  the GameCube's triggers are analogue too,
  ///                                and CLICK at the bottom of their travel
  ///   9 Start · 12..15 D-pad
  ///   axes 0,1 main stick · 2,3 C-stick
  ///
  /// A pad that is not "standard" — a real GameCube adapter, most likely — is
  /// read the same way and SAID SO on the page, because guessing quietly is how
  /// a mis-mapped button becomes a mystery.
  const PAD_BUTTONS = [
    [0, "A"], [1, "B"], [2, "X"], [3, "Y"],
    [4, "L"], [5, "Z"], [9, "START"],
    [12, "D_UP"], [13, "D_DOWN"], [14, "D_LEFT"], [15, "D_RIGHT"],
  ];
  /// Below this a stick is centred. The browser applies the dead zone and
  /// Dolphin applies none (ADR D3): two would compound into a numb stick.
  const DEAD_ZONE = 0.15;
  /// A GameCube trigger clicks at the end of its travel, and games read that
  /// click as a button rather than as a big number.
  const TRIGGER_CLICK = 0.9;

  const analogue = (button) =>
    button === undefined ? 0 : button.value > 0 ? button.value : button.pressed ? 1 : 0;

  /// How far a control must move from rest to count as "that one".
  const MOVED = 0.5;

  /// One control of a profile, read out of a pad.
  ///
  /// A control can be a button OR an axis, and which one is not ours to decide:
  /// an official GameCube adapter reports its triggers as axes and its face
  /// buttons at indices nothing else uses. Both shapes are read the same way
  /// here — how far it has travelled from where it rests, between 0 and 1 —
  /// so nothing above this line has to know which it was.
  const travel = (pad, control) => {
    if (control === undefined || control === null) return 0;
    if (control.button !== undefined) return analogue(pad.buttons[control.button]);
    const value = pad.axes[control.axis] ?? control.rest;
    const span = control.full - control.rest;
    return span === 0 ? 0 : Math.max(0, Math.min(1, (value - control.rest) / span));
  };

  function readPad(pad, profile = padProfile) {
    const dead = (v) => (Math.abs(v) < DEAD_ZONE ? 0 : v);
    let buttons = 0;
    let l = 0;
    let r = 0;
    let x = 0;
    let y = 0;
    let cx = 0;
    let cy = 0;

    if (profile) {
      for (const [name, control] of Object.entries(profile.buttons)) {
        if (travel(pad, control) > MOVED) buttons |= BUTTON[name];
      }
      l = travel(pad, profile.triggers.L);
      r = travel(pad, profile.triggers.R);
      const stick = (control) =>
        control ? dead((pad.axes[control.axis] ?? 0) * control.sign) : 0;
      x = stick(profile.sticks.x);
      y = stick(profile.sticks.y);
      cx = stick(profile.sticks.cx);
      cy = stick(profile.sticks.cy);
    } else {
      for (const [index, name] of PAD_BUTTONS) {
        if (pad.buttons[index]?.pressed) buttons |= BUTTON[name];
      }
      l = analogue(pad.buttons[6]);
      r = analogue(pad.buttons[7]);
      x = dead(pad.axes[0] ?? 0);
      y = -dead(pad.axes[1] ?? 0);
      cx = dead(pad.axes[2] ?? 0);
      cy = -dead(pad.axes[3] ?? 0);
    }

    if (l > TRIGGER_CLICK) buttons |= BUTTON.L;
    if (r > TRIGGER_CLICK) buttons |= BUTTON.R;
    return {
      buttons,
      x,
      y,
      cx,
      cy,
      l: Math.round(Math.min(1, l) * 255),
      r: Math.round(Math.min(1, r) * 255),
    };
  }

  // ── learning a pad ──────────────────────────────────────────────────────
  //
  // A real GameCube controller on an adapter announces an UNKNOWN layout, and
  // that is not a thing to guess at: its indices are its own, its triggers are
  // axes, and the next adapter's will differ again. So the page asks. Each step
  // watches everything the pad reports and takes whatever MOVED — which works
  // the same whether the answer turns out to be a button or an axis, and needs
  // no table of adapters that would be wrong for the one nobody tested.
  const LESSON = [
    ["A", "le bouton A"], ["B", "le bouton B"], ["X", "le bouton X"],
    ["Y", "le bouton Y"], ["Z", "le bouton Z"], ["START", "Start"],
    ["D_UP", "la croix ↑"], ["D_DOWN", "la croix ↓"],
    ["D_LEFT", "la croix ←"], ["D_RIGHT", "la croix →"],
    ["L", "la gâchette L, à fond"], ["R", "la gâchette R, à fond"],
    ["x", "le stick principal à DROITE"], ["y", "le stick principal en HAUT"],
    ["cx", "le stick C à DROITE"], ["cy", "le stick C en HAUT"],
  ];
  let padProfile = null;
  let lesson = null;

  function profileKey(pad) {
    return `nel3ab.pad.${pad.id}`;
  }
  function loadProfile(pad) {
    try {
      const saved = localStorage.getItem(profileKey(pad));
      return saved ? JSON.parse(saved) : null;
    } catch {
      return null;
    }
  }

  /// What the pad looks like right now, as one flat list, so a step can compare
  /// "before" with "now" without caring what kind of control moved.
  const snapshot = (pad) => ({
    buttons: pad.buttons.map((b) => (b.value > 0 ? b.value : b.pressed ? 1 : 0)),
    axes: [...pad.axes],
  });

  function startLesson(pad) {
    lesson = {
      step: 0,
      // Taken ONCE, with nothing held. Re-reading it after each answer was the
      // bug: the sample was taken while the button was still down, so RELEASING
      // it moved just as far as pressing it and answered the next question.
      // Measured by the player: one press of A took the counter from 1 to 3.
      neutral: snapshot(pad),
      waiting: false,
      profile: { id: pad.id, buttons: {}, triggers: {}, sticks: {} },
    };
    skipButton.hidden = false;
    tellLesson();
  }
  function tellLesson() {
    if (lesson === null) return;
    const [, what] = LESSON[lesson.step];
    lessonLine.textContent = lesson.waiting
      ? "relâche…"
      : `appuie sur ${what} (${lesson.step + 1}/${LESSON.length})`;
    lessonLine.className = "note";
  }
  /// Whether everything the pad reports has come back to where it started.
  function atRest(now) {
    return (
      now.buttons.every((v, i) => Math.abs(v - (lesson.neutral.buttons[i] ?? 0)) <= MOVED) &&
      now.axes.every((v, i) => Math.abs(v - (lesson.neutral.axes[i] ?? 0)) <= MOVED)
    );
  }
  function nextStep() {
    lesson.step += 1;
    if (lesson.step < LESSON.length) {
      // The next question is not asked until the hand has let go.
      lesson.waiting = true;
      tellLesson();
      return;
    }
    padProfile = lesson.profile;
    try {
      localStorage.setItem(`nel3ab.pad.${padProfile.id}`, JSON.stringify(padProfile));
    } catch {
      // Private browsing, most likely. The profile still works for this session.
    }
    lesson = null;
    skipButton.hidden = true;
    lessonLine.textContent = "manette apprise — elle sera retenue pour la prochaine fois";
  }

  /// Takes whatever moved furthest from rest, and records it as the control for
  /// this step. Furthest rather than first: a GameCube trigger moves its axis
  /// AND clicks a button, and the axis is the one worth keeping.
  function learnFrom(pad) {
    if (lesson === null) return;
    const now = snapshot(pad);
    if (lesson.waiting) {
      if (atRest(now)) {
        lesson.waiting = false;
        tellLesson();
      }
      return;
    }
    const [name] = LESSON[lesson.step];
    let best = null;
    now.buttons.forEach((value, index) => {
      const moved = Math.abs(value - (lesson.neutral.buttons[index] ?? 0));
      if (moved > MOVED && (best === null || moved > best.moved)) {
        best = { moved, control: { button: index }, value };
      }
    });
    now.axes.forEach((value, index) => {
      const rest = lesson.neutral.axes[index] ?? 0;
      const moved = Math.abs(value - rest);
      if (moved > MOVED && (best === null || moved > best.moved)) {
        best = { moved, control: { axis: index, rest, full: value }, value, rest };
      }
    });
    if (best === null) return;

    if (name === "L" || name === "R") {
      lesson.profile.triggers[name] = best.control;
    } else if (["x", "y", "cx", "cy"].includes(name)) {
      // A stick is signed, and the sign is whichever way the player just pushed:
      // asking for RIGHT and UP means the recorded direction IS positive.
      lesson.profile.sticks[name] = best.control.axis === undefined
        ? null
        : { axis: best.control.axis, sign: best.value >= best.rest ? 1 : -1 };
    } else {
      lesson.profile.buttons[name] = best.control;
    }
    nextStep();
  }

  learnButton.addEventListener("click", () => {
    const pad = navigator.getGamepads?.().find((p) => p);
    if (!pad) {
      lessonLine.textContent = "aucune manette détectée — appuie sur un bouton d'abord";
      lessonLine.className = "bad";
      return;
    }
    startLesson(pad);
  });
  skipButton.addEventListener("click", () => {
    if (lesson !== null) nextStep();
  });

  const held = new Set();
  addEventListener("keydown", (event) => {
    if (event.code in KEYS || event.code.startsWith("Arrow")) event.preventDefault();
    held.add(event.code);
  });
  addEventListener("keyup", (event) => held.delete(event.code));
  addEventListener("blur", () => held.clear());

  // The state is sent every animation frame rather than on key events. A pad is
  // a LEVEL, not an edge: a dropped "keyup" would otherwise leave the character
  // running into a wall forever, and resending is 13 bytes.
  let sent = 0;
  function pumpInput() {
    requestAnimationFrame(pumpInput);

    // Learning happens whether or not this page holds a controller: a player
    // whose room is momentarily full should still be able to set their pad up
    // rather than being told to come back later. It also means the presses that
    // answer the questions never reach the game.
    const attached = navigator.getGamepads?.().find((p) => p);
    if (attached && lesson !== null) {
      learnFrom(attached);
      return;
    }

    // A frame with no port is not a frame the server would accept — its slot
    // byte must be 1..=4 — and sending one would be rejected as rubbish, which
    // closes the connection. So: no port, nothing to say.
    if (input === null || input.readyState !== WebSocket.OPEN || port === null) return;

    let buttons = 0;
    for (const [code, name] of Object.entries(KEYS)) {
      if (held.has(code)) buttons |= BUTTON[name];
    }
    let x = (held.has("ArrowRight") ? 1 : 0) - (held.has("ArrowLeft") ? 1 : 0);
    let y = (held.has("ArrowUp") ? 1 : 0) - (held.has("ArrowDown") ? 1 : 0);
    let cx = 0;
    let cy = 0;
    let l = held.has("KeyQ") ? 255 : 0;
    let r = held.has("KeyE") ? 255 : 0;

    const pad = navigator.getGamepads?.().find((p) => p);
    if (pad) {
      if (padProfile === null) padProfile = loadProfile(pad);
      const read = readPad(pad);
      // The pad wins where it says something and the keyboard keeps the rest,
      // so a stick at rest does not cancel a key being held.
      buttons |= read.buttons;
      x = read.x || x;
      y = read.y || y;
      cx = read.cx;
      cy = read.cy;
      l = Math.max(l, read.l);
      r = Math.max(r, read.r);
      describePad(pad, read);
    }

    const frame = new Uint8Array(13);
    const view = new DataView(frame.buffer);
    view.setUint16(0, buttons, true);
    frame[2] = port;
    view.setInt16(3, Math.round(x * 32767), true);
    view.setInt16(5, Math.round(y * 32767), true);
    view.setInt16(7, Math.round(cx * 32767), true);
    view.setInt16(9, Math.round(cy * 32767), true);
    frame[11] = l;
    frame[12] = r;
    input.send(frame);
    sent += 1;
  }

  /// Says what pad is attached and what it is doing, because "the buttons are
  /// wrong" is unanswerable without knowing which button the pad reported.
  function describePad(pad, read) {
    const pressed = Object.entries(BUTTON)
      .filter(([, bit]) => read.buttons & bit)
      .map(([name]) => name)
      .join(" ");
    padLine.textContent =
      `manette : ${pad.id} — ${
        padProfile ? "profil appris" : pad.mapping === "standard" ? "disposition standard" : "disposition inconnue"
      }` +
      `${pressed ? ` · ${pressed}` : ""}` +
      `${read.l || read.r ? ` · L ${read.l} R ${read.r}` : ""}`;
  }
  requestAnimationFrame(pumpInput);

  // The watchdog. Runs on its own timer rather than inside the stats display,
  // so a change to what is shown can never quietly disarm it.
  setInterval(() => {
    if (!connected || lastHeard === null) return;
    if (performance.now() - lastHeard < SILENCE_LIMIT) return;
    stalls += 1;
    lastHeard = null;
    // Closing is what starts the reconnection: the same path a clean close
    // takes, so there is only one way back rather than two.
    video?.close();
  }, 500);

  // The second watchdog, for the other half of the failure. The first one asks
  // whether the socket still speaks; this one asks whether the decoder still
  // answers. Seen in the wild: sockets up, the server writing sixty frames a
  // second with nothing dropped, the page still sending pad frames — and the
  // picture stopped. Bytes arriving is precisely what blinded the first
  // watchdog, so the two conditions have to be read together.
  setInterval(() => {
    if (!connected) return;
    const now = performance.now();
    // Only meaningful while bytes are arriving: if they are not, this is the
    // other watchdog's failure and reconnecting is the right answer.
    if (lastHeard === null || now - lastHeard >= SILENCE_LIMIT) return;
    // And only while somebody is painting. A page whose display has stopped
    // asking is deliberately not feeding its decoder, so a silent decoder is
    // the intended state and not a fault. Without this the watchdogs fired in a
    // loop behind a switched-away tab, tearing the connection down every few
    // seconds — a page that could not recover BECAUSE of the code meant to
    // recover it.
    if (lastPaintTick === null || now - lastPaintTick > PAINTING_STOPPED) return;

    // Fed, and producing nothing: the gap is measured between the two, not
    // against the clock, so pausing the feed can never look like a failure.
    if (lastOutput !== null && lastFed !== null && lastFed - lastOutput > SILENCE_LIMIT) {
      restartDecoder();
      return;
    }
    // A rebuilt decoder that never gets its key frame would wait for ever, and
    // nothing above would notice: rejoining makes the server send one.
    if (
      decoder === null &&
      decoderGoneSince !== null &&
      now - decoderGoneSince > KEY_FRAME_PATIENCE
    ) {
      decoderGoneSince = null;
      video?.close();
    }
  }, 500);

  setInterval(() => {
    if (decoder === null) {
      show("waiting for a key frame from the emulator…");
      return;
    }
    // Rates, not a percentage of refreshes. "72.5 % of refreshes had nothing
    // new" sounds alarming and means almost nothing: on a 120 Hz display a
    // perfect 60 fps stream leaves HALF the refreshes with nothing new by
    // construction, and this reported 72.5 % where the honest statement was
    // "33 painted of 60 sent". A number that cannot be read without knowing the
    // refresh rate is a number that will be misread.
    const elapsed = (performance.now() - firstArrival) / 1000;
    const rate = (count) => (elapsed > 0 ? count / elapsed : 0).toFixed(1);
    show(
      `silence recoveries   ${stalls}\n` +
        `decoder restarts     ${restarts}\n` +
        `not decoded          ${undecoded} (nobody painting, or behind)\n` +
        `latence ajoutée      ${slackMs.toFixed(0)} ms (marge), ` +
        `${starved} starves, ${skipped} skipped\n` +
        `lissage des rafales  p50 ${percentile(waits, 0.5).toFixed(1)} ms, ` +
        `p95 ${percentile(waits, 0.95).toFixed(1)} ms\n` +
        `connection           ${connected ? "up" : "reconnecting…"}` +
        `${reconnects > 0 ? ` (${reconnects} drop${reconnects > 1 ? "s" : ""})` : ""}\n` +
        `sent by the server   60.0 /s (nominal)\n` +
        `arrived              ${rate(shown)} /s\n` +
        `painted              ${rate(painted)} /s\n` +
        `display refresh      ${rate(painted + repeated)} /s ` +
        `(${(1000 / refreshPeriod()).toFixed(0)} Hz)\n` +
        `picture held         ${percentile(holds, 0.5).toFixed(0)} refreshes ` +
        `(p05 ${percentile(holds, 0.05).toFixed(0)}, p95 ${percentile(holds, 0.95).toFixed(0)})\n` +
        `pad frames           ${sent}\n` +
        `decoder queue        ${decoder.decodeQueueSize}\n` +
        `\n` +
        `gap between arrivals (16.7 ms is even):\n` +
        `  p50 ${percentile(gaps, 0.5).toFixed(1)} ms\n` +
        `  p95 ${percentile(gaps, 0.95).toFixed(1)} ms\n` +
        `  max ${percentile(gaps, 1).toFixed(1)} ms\n` +
        `\n` +
        `transit DRIFT since the first frame (not a latency):\n` +
        `  p50 ${percentile(recent, 0.5).toFixed(1)} ms\n` +
        `  p95 ${percentile(recent, 0.95).toFixed(1)} ms\n` +
        `  max ${percentile(recent, 1).toFixed(1)} ms\n` +
        `\n` +
        `The gap figures are what stutter is made of: a p95 far\n` +
        `above 16.7 ms means frames arrive in bursts, and no\n` +
        `amount of decoding speed can smooth that out.\n` +
        `\n` +
        `The drift figures can go NEGATIVE, and that is not a bug:\n` +
        `the two clocks are anchored on the first frame and only\n` +
        `their DIFFERENCE is reported, so a first frame that was\n` +
        `unusually slow makes every later one look early. It says\n` +
        `how transit CHANGED, never how long it takes.`,
    );
  }, 500);
</script>
