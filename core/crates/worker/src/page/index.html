    <!-- `viewport-fit=cover`: la page va jusqu'aux bords d'un téléphone à
         encoche, et c'est elle qui se tient hors des zones sûres, par les
         jetons `--zone-*` d'index.css. Sans lui, `env(safe-area-inset-*)`
         valait zéro partout et les marges écrites pour l'encoche ne servaient
         à rien (audit mobile, 22 novembre 2026). -->

         zones sûres. -->

    <title>nel3ab</title>
    <!-- Le thème choisi, posé AVANT la première image. Le script de la page est
         un module, lancé seulement après la lecture de tout le document: un
         choix contre le système s'y peignait d'abord aux couleurs du système
         (mesuré le 22 novembre 2026 sur la page construite: « nuit » sous un
         système clair commençait en craie, quatre chargements sur quatre).
         Un script classique dans l'en-tête tourne avant le corps. Il refait
         `storedTheme()` (src/lib/theme.ts) et un essai les compare valeur par
         valeur (`theme-en-tete.test.ts`). La politique du worker nomme chaque
         script par son empreinte (`script_policy`): il n'y a rien à ouvrir. -->
    <script>
      (function () {
        var choix = "auto";
        var anciens = {
          "instrument-sombre": "nuit",
          phosphore: "nuit",
          ambre: "nuit",
          "instrument-clair": "jour",
          indigo: "jour",
          famicom: "jour",
          gameboy: "jour",
        };
        try {
          var lu = localStorage.getItem("nel3ab:theme");
          if (lu === "auto" || lu === "nuit" || lu === "jour") choix = lu;
          else if (lu !== null && Object.prototype.hasOwnProperty.call(anciens, lu)) choix = anciens[lu];
        } catch (refus) {
          choix = "auto";
        }
        document.documentElement.dataset.theme = choix;
      })();
      /* effets: début. Les effets rétro du réglage de l'appareil, posés avant
         la première image (ADR D37). Écrit depuis `scriptEnTete()`
         (src/lib/effets.ts) par `N3_SALON_ECRIRE=1 npx vitest run
         src/lib/salon-retro.test.ts`, qui échoue si ce bloc n'est plus le
         sien. */
(function () {
  var effets = "mire-vide/d/o mire-charge/m/- palette/d/o cycle/m/- tramage/d/o titres/d/o texte-pixel/M/- coins/d/o ombres/d/o nettes/d/o icones/d/o pointeur/m/- chiffres/d/o curseur/d/o boutons/d/o start/m/o arrive/d/o lettres/m/- compteur/m/- sons/m/- secousse/M/- fondu/d/o mosaique/m/o iris/m/- tuiles/m/- coupure/m/- defile/M/- extinction/m/o paliers/m/- balayage/m/o balayage-tout/M/- grille/M/- vignette/m/- halo/d/o bave/m/- neige/m/o roulement/m/- scintille/M/- courbure/M/- fronton/d/o borne/m/- places/d/o initiales/m/- scores/d/o demo/m/- credit/d/o".split(" ");
  function appliquer() {
    var niveau = "conseille", sons = false;
    try {
      var lu = JSON.parse(localStorage.getItem("nel3ab:effets") || "null");
      if (lu && typeof lu === "object") {
        if (lu.niveau === "sobre" || lu.niveau === "conseille" || lu.niveau === "tout") niveau = lu.niveau;
        if (lu.sons === true) sons = true;
      }
    } catch (refus) {}
    try {
      var racine = document.documentElement;
      for (var i = 0; i < effets.length; i++) {
        var e = effets[i].split("/");
        var actif = e[0] === "sons" ? sons : niveau === "tout" ? true : niveau === "sobre" ? e[1] === "d" : e[2] === "o";
        racine.classList.toggle("fx-" + e[0], actif);
      }
      racine.setAttribute("data-effets", niveau);
      racine.setAttribute("data-sons", sons ? "oui" : "non");
    } catch (refus) {}
  }
  appliquer();
  try {
    window.nel3abEffets = { appliquer: appliquer };
    window.addEventListener("storage", function (e) {
      if (e.key === "nel3ab:effets" || e.key === null) appliquer();
    });
  } catch (refus) {}
})();

o et sauvegardes séparées par jeu`,players:4,engine:`ryubing`,form:{kind:`external`,script:`docker/switch-room.py`,script_env:`NEL3AB_SWITCH_ADAPTER`,config_env:`NEL3AB_SWITCH_CONFIG`},input:`pro`,devices:[4],lock:`switch`,art:`sidecar`,format:`16:9`,media:`card`,folder:`switch`,registration:`sidecar`,extensions:[`xci`,`nsp`],experimental:!1,playable:!0,why:{lock:`Une seule salle à la fois joue à un jeu de la famille Switch, décidé le 12 septembre 2026 : Ryubing coûte bien plus cher que Dolphin. Le verrou est un fichier tenu par le worker (lock::take_switch).`,registration:`Un NSP peut être une mise à jour : son extension ne suffit jamais, il faut une fiche <fichier>.nel3ab.json (emulator::switch). Elle s'écrit à la main après un lancement d'essai, ou par l'import du salon après lecture de l'en-tête NCA, chiffré avec la clé de la console.`}},{code:`switch2`,label:`Switch 2`,note:`un joueur et des spectateurs ; ralentissements et objets manquants possibles`,players:1,engine:`eden`,form:{kind:`external`,script:`docker/switch2-room.py`,script_env:`NEL3AB_SWITCH2_ADAPTER`,config_env:`NEL3AB_SWITCH2_CONFIG`},input:`pro`,devices:[4],lock:`switch`,art:`sidecar`,format:`16:9`,media:`card`,folder:`switch2`,registration:`sidecar`,extensions:[`nup`],experimental:!0,playable:!0,why:{players:`L'intégration du 7 novembre 2026 n'a validé qu'un joueur et des spectateurs. C'est une limite de notre adaptateur, pas de la console.`,lock:`Le même verrou que la Switch : les deux moteurs ne tiennent pas ensemble sur la carte graphique.`,experimental:`Souhib l'a gardée dans la salle le 21 novembre 2026, marquée expérimentale.`}},{code:`x360`,label:`Xbox 360`,note:`gâchettes tout ou rien, à-coups possibles`,players:4,engine:`xenia`,form:{kind:`external`,script:`docker/xbox360-room.py`,script_env:`NEL3AB_XBOX360_ADAPTER`,config_env:`NEL3AB_XBOX360_CONFIG`},input:`pro`,devices:[4],lock:null,art:`sidecar`,format:`16:9`,media:`disc`,folder:`xbox360`,registration:`sidecar`,extensions:[`iso`],con   <body>
    <!-- Ce qu'on voit avant que le script de la page ait tourné, au lieu d'une
         page blanche (audit E8) : le squelette de la salle, l'écran noir, le
         panneau aux quatre START éteints et la colonne qui dit « On ouvre la
         salle 2… ». Les classes sont celles de l'ouverture
         (`components/ouverture.css`), déjà dans la feuille de l'en-tête de la
         page construite. React le remplace à son premier rendu par
         `Ouverture`, qui dessine les mêmes rectangles. Le petit script dessous
         écrit le numéro de la salle et la largeur gardée de la colonne, comme
         `salle()` et `storedColumn()` ; `Ouverture.test.tsx` les compare. -->
    <div id="root">
      <div class="n3-ouverture n3-ouverture-statique">
        <main class="relative flex min-w-0 flex-1 flex-col">
          <div class="n3-ouverture-ecran"></div>
          <div class="n3-panneau n3-ouverture-panneau" data-forme="sous" aria-hidden="true">
            <div class="n3-panneau-places">
              <span class="n3-ouverture-start"><span class="rt-bouton-start" data-libre="">1P</span></span>
              <span class="n3-ouverture-start"><span class="rt-bouton-start" data-libre="">2P</span></span>
              <span class="n3-ouverture-start"><span class="rt-bouton-start" data-libre="">3P</span></span>
              <span class="n3-ouverture-start"><span class="rt-bouton-start" data-libre="">4P</span></span>
            </div>
          </div>
        </main>
        <aside class="n3-colonne n3-ouverture-colonne border-l border-rule bg-panel px-3 pt-3">
          <header class="n3-colonne-tete"><h1 class="n3-colonne-salle" data-salle="">Salle</h1></header>
          <p class="n3-ouverture-titre" role="status" data-ouvre="">On ouvre la salle…</p>
        </aside>
      </div>
    </div>
    <script>
      (function () {
        try {
          var racine = document.getElementById("root");
          var trouve = /^\/r\/(\d+)\//.exec(location.pathname);
          var n = trouve && Number(trouve[1]) > 0 ? Number(trouve[1]) : 1;
          racine.querySelector("[data-salle]").textContent = "Salle " + n;
          racine.querySelector("[data-ouvre]").textContent = "On ouvre la salle " + n + "\u2026";
          var largeur = localStorage.getItem("nel3ab:colonne");
          if (largeur !== null && /^\d+$/.test(largeur))
            racine.style.setProperty("--ouverture-colonne", Math.min(480, Math.max(256, Number(largeur))) + "px");
        } catch (refus) {}
      })();
    </script>
  </body>
</html>
